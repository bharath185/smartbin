<div class="main">
  <header class="topbar">
    <span class="topbar-title">Employee Management</span>
    <div class="topbar-actions"><div class="avatar">A</div></div>
  </header>
  <div class="content">
    <div class="panel">
      <div class="panel-header">
        <h2>All Employees</h2>
        <button class="btn btn-primary" onclick="openModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Employee
        </button>
      </div>
      <div class="panel-body">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Points</th><th>Actions</th></tr></thead>
          <tbody id="empTable"><tr><td colspan="7" style="text-align:center;padding:40px;color:var(--gray-400)">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header"><h3>Onboard New Employee</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>Employee ID</label><input class="form-control" id="fEmpId" placeholder="e.g. EMP006"></div>
        <div class="form-group"><label>Full Name</label><input class="form-control" id="fName" placeholder="John Doe"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Email</label><input class="form-control" id="fEmail" type="email" placeholder="john@smartbin.com"></div>
        <div class="form-group"><label>Phone</label><input class="form-control" id="fPhone" placeholder="9876543210"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Password</label><input class="form-control" id="fPass" type="password" placeholder="********"></div>
        <div class="form-group"><label>Role</label><select class="form-control" id="fRole"><option value="employee">Employee</option><option value="admin">Admin</option></select></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addEmployee()">Create Employee</button></div>
  </div>
</div>
<script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/ws-init.js"></script>
<script>
document.getElementById('nav-employees').classList.add('active');
function openModal(){document.getElementById('addModal').classList.add('show');}
function closeModal(){document.getElementById('addModal').classList.remove('show');}
async function loadEmployees(){
    try{const emps=await api.get('/employees/');const tbody=document.getElementById('empTable');
    if(!emps.length){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--gray-400)">No employees found.</td></tr>';return;}
    tbody.innerHTML=emps.map(e=>'<tr><td><strong>'+e.employee_id+'</strong></td><td>'+e.name+'</td><td>'+e.email+'</td><td>'+(e.phone||'--')+'</td><td><span class="badge '+(e.role==='admin'?'badge-ready':'badge-empty')+'">'+e.role+'</span></td><td><strong>'+e.reward_points+'</strong></td><td><button class="btn btn-danger btn-sm" onclick="deleteEmp(\''+e.employee_id+'\')">Delete</button></td></tr>').join('');}catch(e){showToast('Failed to load','error');}
}
async function addEmployee(){
    const body={employee_id:document.getElementById('fEmpId').value,name:document.getElementById('fName').value,email:document.getElementById('fEmail').value,phone:document.getElementById('fPhone').value,password:document.getElementById('fPass').value,role:document.getElementById('fRole').value};
    if(!body.employee_id||!body.name||!body.email||!body.password){showToast('Fill all required fields','error');return;}
    try{await api.post('/employees/',body);showToast('Employee onboarded!');closeModal();loadEmployees();}catch(e){showToast(e.message,'error');}
}
async function deleteEmp(id){if(!confirm('Delete '+id+'?'))return;try{await api.del('/employees/'+id);showToast('Deleted');loadEmployees();}catch(e){showToast(e.message,'error');}}
loadEmployees();
</script>
</body>
</html>
