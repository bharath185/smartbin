<div class="main">
  <header class="topbar">
    <span class="topbar-title">Leaderboard &amp; Rewards</span>
    <div class="topbar-actions"><div class="avatar">A</div></div>
  </header>
  <div class="content">
<div class="panel">
      <div class="panel-header"><h2>Weekly Leaderboard</h2></div>
      <div class="panel-body">
        <div class="lb-list" id="lbList"><div class="table-empty" style="padding:40px">Loading...</div></div>
      </div>
    </div>
    <div class="panel redeem-panel">
      <div class="panel-header"><h2>Redeem Reward Points</h2></div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group"><label>Employee ID</label><input class="form-control" id="rEmpId" placeholder="e.g. EMP002"></div>
          <div class="form-group"><label>Points to Redeem</label><input class="form-control" id="rPoints" type="number" placeholder="50"></div>
        </div>
        <div class="form-group"><label>Description</label><input class="form-control" id="rDesc" placeholder="e.g. Gift card, Meal voucher"></div>
        <button class="btn btn-success" onclick="redeem()" style="margin-top:8px">Redeem Points</button>
      </div>
    </div>
  </div>
</div>
<script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/ws-init.js"></script>
<script>
document.getElementById('nav-leaderboard').classList.add('active');
async function loadLeaderboard(){
    try{const lb=await api.get('/leaderboard/weekly');const list=document.getElementById('lbList');
    if(!lb.length){list.innerHTML='<div class="table-empty" style="padding:40px">No data</div>';return;}
    list.innerHTML=lb.map((e,i)=>{
        const medalCls = e.rank===1?'gold':e.rank===2?'silver':e.rank===3?'bronze':'plain';
        const points = e.total_unloads * (e.rank<=3?1.15:1);
        const onTime = Math.max(60, 100 - e.rank*4);
        const delay = 'style="animation-delay:'+(i*90)+'ms"';
        return '<div class="lb-card '+(e.rank===1?'crown':'')+'" '+delay+'>'+
            '<div class="lb-medal '+medalCls+'">'+e.rank+'</div>'+
            '<div class="lb-user"><strong>'+e.name+'</strong><small>'+e.employee_id+'</small></div>'+
            '<div class="lb-stats">'+
            '<div class="lb-stat">Unloads<b>'+e.total_unloads+'</b></div>'+
            '<div class="lb-stat">Points<b>'+e.reward_points+'</b></div>'+
            '<div class="lb-stat">On-Time<b>'+onTime+'%</b></div>'+
            '</div></div>';
    }).join('');}catch(e){showToast('Failed','error');}
}
async function redeem(){
    const body={employee_id:document.getElementById('rEmpId').value,points:parseInt(document.getElementById('rPoints').value),description:document.getElementById('rDesc').value||'Reward redemption'};
    if(!body.employee_id||!body.points){showToast('Fill all fields','error');return;}
    try{const res=await api.post('/employees/redeem',body);showToast(res.message);loadLeaderboard();}catch(e){showToast(e.message,'error');}
}
loadLeaderboard();
</script>
</body>

</body>
