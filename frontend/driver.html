function buildNotifs() {
    var base = [
      { title: 'Shift started', msg: 'Your 06:00 collection round has begun. Stay safe on the road.', time: 'Today 06:00', type: 'ok' },
      { title: 'Route optimisation ready', msg: 'Your optimised route for this morning is loaded in the Route Plan.', time: 'Today 06:01', type: 'info' }
    ];
    // real automatic collection-task assignment
    if (CUR_TASK) {
      base.unshift({
        title: 'New Collection Task',
        msg: CUR_TASK.dustbin_code + ' is ' + Math.round(CUR_TASK.fill_level) + '% full. Collection task automatically assigned to you. (' + statusLabel(CUR_TASK.status) + ')',
        time: timeAgo(CUR_TASK.assigned_at), type: 'warn', task: CUR_TASK
      });
    }
    pendingBins().forEach(function (b) {
      base.push({
        title: 'Task: Bin ' + b.dustbin_id + ' needs collection',
        msg: (b.location || 'Area bin') + ' is ' + Math.round(b.fill_level) + '% full.',
        time: 'Live', type: 'warn'
      });
    });
    var one = pendingBins()[Math.floor(Math.random() * Math.max(pendingBins().length, 1))];
    if (one) base.push({ title: 'Gas sensor check', msg: 'MQ-4 reading normal for ' + one.dustbin_id + '. No fire risk detected.', time: 'Today', type: 'ok' });
    else base.push({ title: 'Gas sensor check', msg: 'All sensors nominal. No fire risk detected in your area.', time: 'Today', type: 'ok' });
    base.push({ title: 'Weekly reward summary', msg: 'You earned ' + (collectedIds().length * 10) + ' points this shift so far.', time: 'Today', type: 'info' });
    var read = sessionStorage.getItem('smb:dnotifs') === 'read';
    return base.map(function (n) { n.read = read; return n; });
  }

  function renderProfile() {
    var host = document.getElementById('dViewHost');
    var s = window.Auth.session() || {};
    var d = DRIVER || {};
    host.innerHTML =
      '<div class="d-profile-grid">' +
      '  <section class="glass d-panel d-prof-card">' +
      '    <div class="d-prof-avatar">' + esc((s.name || 'D').charAt(0).toUpperCase()) + '</div>' +
      '    <h3>' + esc(s.name) + '</h3><span class="d-st-pill ok">' + (s.status === 'active' ? 'Active Driver' : (s.status || 'Driver')) + '</span>' +
      '    <div class="d-prof-meta">' +
      metRow('email', esc(d.email || '-')) + metRow('phone', esc(d.mobile || '-')) +
      metRow('car', esc(d.vehicle_number || '-')) + metRow('area', esc(d.assigned_area || '-')) +
      metRow('route', esc(d.assigned_route || '-')) +
      metRow('id', esc(d.employee_id || ('EMP#' + (d.id || '-')))) +
      '</div></section>' +
      '  <section class="glass d-panel"><div class="d-panel-head"><h3>About your console</h3></div>' +
      '  <div class="d-about">' +
      '    <p><b>Scan &amp; Upload</b> — scan a bin QR in your area to record a live collection and reset the bin.</p>' +
      '    <p><b>Assigned Bins</b> — your area and route map to the bins you are responsible for.</p>' +
      '    <p><b>Rewards</b> — every recorded collection earns points on your history and the leaderboard.</p>' +
      '    <p><b>Assigned Routes</b> — order your stops so you finish fastest with the least fuel.</p>' +
      '  </div></section>' +
      '</div>';
  }
  function metRow(k, v) {
    return '<p><i>' + k + '</i><span>' + esc(v) + '</span></p>';
  }

  function showLoader(on) { document.getElementById('drvLoader').style.display = on ? 'flex' : 'none'; }

  /* ============================================================
     LIVE GPS tracking — relay the driver's real device position
     to the Municipality Live Map.
     Only runs for ACTIVE drivers. Battery-conscious: interval
     throttled; high-accuracy watchPosition handles the rest.
     ============================================================ */
  var gpsState = { running: false, lastSent: 0, lastFix: null, denied: false, error: false };
  var GPS_SEND_INTERVAL = 8000;   // ms between backend pushes

  function gpsStatusEl() {
    return document.querySelector('.d-live');
  }
  function setGpsUI(kind, label) {
    var el = gpsStatusEl();
    if (!el) return;
    el.className = 'd-live ' + kind;
    el.innerHTML = '<i></i>' + label;
  }

  function headingDeg(deg) {
    if (deg == null) return '—';
    var dirs = ['N','NE','E','SE','S','SW','W','NW'];
    return dirs[Math.round(deg / 45) % 8];
  }

  async function pushFix(pos) {
    if (!DRIVER || !DRIVER.id) return;
    var coords = pos && pos.coords ? pos.coords : (pos && pos.coords ? pos : null);
    if (!coords) return;
    if (DRIVER.status !== 'active' && DRIVER.status !== 'verified') { stopTracking(); return; }
    try {
      await api.post('/drivers/location', {
        driver_id: DRIVER.id,
        latitude: coords.latitude,
        longitude: coords.longitude,
        accuracy: coords.accuracy || null,
        speed: (coords.speed != null && coords.speed >= 0) ? Math.round(coords.speed * 3.6) : null,
        heading: coords.heading,
        is_active: true
      });
    } catch (e) { /* non-fatal: retry next interval */ }
  }

  function onGpsSuccess(pos) {
    var coords = pos.coords;
    gpsState.lastFix = { lat: coords.latitude, lng: coords.longitude, at: Date.now() };
    gpsState.error = false;
    gpsState.denied = false;   /* a real fix proves permission — clears a stale denial */
    setGpsUI('live', 'GPS Active');
    var now = Date.now();
    if (now - gpsState.lastSent >= GPS_SEND_INTERVAL) {
      gpsState.lastSent = now;
      pushFix(pos);
    }
    if (currentView === 'routes' && routeStatus() !== lastRoutesStatus) renderRoutes();
    if (currentView === 'map') navUpdate();
  }

  function onGpsError(err) {
    if (err && err.code === 1) {
      gpsState.denied = true;
      gpsState.error = false;
      setGpsUI('off', 'GPS Offline');
      stopTracking(false);
    } else if (err && err.code === 2) {
      // position unavailable — temporarily lost the signal
      gpsState.error = true;
      setGpsUI('off', 'GPS Offline');
      stopTracking(false);
    } else {
      // timeout (3) — keep trying, show a transient "searching" state
      setGpsUI('req', 'GPS Searching');
    }
    if (currentView === 'routes' && routeStatus() !== lastRoutesStatus) renderRoutes();
    if (currentView === 'map') renderMap();
  }

  function startTracking() {
    if (gpsState.running) return;
    if (!navigator.geolocation) {
      gpsState.denied = true;
      setGpsUI('off', 'GPS Offline');
      return;
    }
    gpsState.running = true;
    setGpsUI('req', 'GPS Searching');
    if (!navigator.permissions || !navigator.permissions.query) {
      gpsState.watchId = navigator.geolocation.watchPosition(
        onGpsSuccess, onGpsError,
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
      return;
    }
    navigator.permissions.query({ name: 'geolocation' }).then(function (res) {
      if (res.state === 'denied') {
        gpsState.denied = true;
        setGpsUI('off', 'GPS Offline');
        return;
      }
      gpsState.denied = false;   /* permission granted/prompt again — retry allowed */
      gpsState.watchId = navigator.geolocation.watchPosition(
        onGpsSuccess, onGpsError,
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
    }).catch(function () {
      gpsState.watchId = navigator.geolocation.watchPosition(
        onGpsSuccess, onGpsError,
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
    });
  }

  function stopTracking(markInactive) {
    if (gpsState.watchId != null) {
      navigator.geolocation.clearWatch(gpsState.watchId);
      gpsState.watchId = null;
    }
    gpsState.running = false;
    if (DRIVER && DRIVER.id && markInactive !== false) {
      api.post('/drivers/location', {
        driver_id: DRIVER.id, latitude: 0, longitude: 0, is_active: false
      }).catch(function () {});
    }
    setGpsUI('off', 'GPS Offline');
  }

  /* start / stop tied to driver ACTIVE status */
  window.__startDriverTracking = function () {
    if (DRIVER && (DRIVER.status === 'active' || DRIVER.status === 'verified')) {
      startTracking();
    } else {
      setGpsUI('off', 'GPS Offline');
    }
  };
  window.__stopDriverTracking = function () { stopTracking(true); };

  function setBadges() {
    document.getElementById('myColBadge').textContent = (MYCOLLS || []).length;
    document.getElementById('assignBadge').textContent = assignedBins().length;
    document.getElementById('compBadge').textContent = (COMPLAINTS || []).filter(function (c) { return c.status === 'OPEN'; }).length;
    document.getElementById('notifBadge').textContent = buildNotifs().filter(function (n) { return !n.read; }).length;
  }

  async function refreshDriverData() {
    if (!DRIVER || !DRIVER.id) return;
    try {
      var b = await api.get('/dustbins/');
      BINS = (Array.isArray(b) ? b : (b.value || []));
      MYCOLLS = await api.get('/collections/driver/' + DRIVER.id);
      DRIV_SUM = await api.get('/collections/driver/' + DRIVER.id + '/summary');
      COMPLAINTS = await api.get('/complaints/');
      var ta = await api.get('/tasks/driver/' + DRIVER.id);
      TASK_ALL = (Array.isArray(ta) ? ta : (ta.value || []));
      await pollCurrentTask();
      setBadges();
      dataReady = true;
      dashErr = false;
      if (currentView === 'routes') renderRoutes();
      else if (currentView === 'assigned') renderAssigned();
    } catch (e) {
      dataReady = true;
      if (!BINS.length && !MYCOLLS.length && !TASK_ALL.length) dashErr = true;
    }
  }

  (async function init() {
    showLoader(true);
    try {
      var dst = await api.get('/dustbins/');
      BINS = (Array.isArray(dst) ? dst : (dst.value || []));
      var lb = await api.get('/leaderboard/weekly');
      LEADERBOARD = (Array.isArray(lb) ? lb : (lb.value || []));
    } catch (e) { showToast('Could not reach the Smart City network.', 'error'); }
    try {
      DRIVER = await window.Auth.me(SESSION.token);
    } catch (e) { DRIVER = { id: 0, name: SESSION.name, email: SESSION.email }; }
    await refreshDriverData();
    loadJsQR();   // pre-warm the QR decoder (local file first) so scanning starts instantly
    showLoader(false);
    showView('dashboard');
    setBadges();
    if (shiftState() === 'available') { window.__startDriverTracking(); }
    else { window.__stopDriverTracking(); }
    // real-time: poll for newly auto-assigned tasks every 5s;
    // the assigned bins view also refreshes live (throttled) so a newly
    // auto-assigned urgent bin appears in BOTH the summary and the table.
    setInterval(function () {
      pollCurrentTask();
      if (currentView === 'assigned' && Date.now() - lastAssignedFetch >= 30000) refreshAssignedLive();
    }, 5000);
  })();
  </script>
