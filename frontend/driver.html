  /* ---- QR payload decoding (matches existing SmartBin QR formats) ----
     Formats actually generated by the project:
       - registration:    "SMARTBIN:<DB_ID>:<hex8>"   (backend rountine in dustbins.py)
       - municipality UI: <origin>/complaint.html?dustbin=<DB_ID>
       - printed/simple:  DB007
       - defensive:       JSON {"binId":"DB007"|"dustbin_id":...|"id":...}
     The payload is ALWAYS treated as untrusted input. */
  function parseScanValue(raw) {
    var v = String(raw == null ? '' : raw).trim();
    if (!v) return null;
    /* URL payloads: ?dustbin= / ?bin= / ?id= / ?code= / ?name=  (municipality links) */
    try {
      var u = new URL(v);
      var d = u.searchParams.get('dustbin') || u.searchParams.get('bin') || u.searchParams.get('id') || u.searchParams.get('code') || u.searchParams.get('name');
      if (d) return d.toUpperCase();
    } catch (e) {}
    /* JSON payloads (defensive) */
    if (v.charAt(0) === '{' && v.charAt(v.length - 1) === '}') {
      try {
        var j = JSON.parse(v);
        var keys = ['dustbin_id', 'binId', 'bin_id', 'dustbin', 'code', 'id', 'name'];
        for (var i = 0; i < keys.length; i++) { if (j && j[keys[i]]) return String(j[keys[i]]).toUpperCase(); }
      } catch (e) {}
    }
    /* labelled QR payloads — municipality smart-bin codes are usually printed as
       SMARTBIN:<DB_ID>:<hex8> (backend registration) or bin:DB007 / ID=DB007 etc. */
    var m = v.match(/^(?:SMARTBIN|SMART BIN|DUSTBIN|BIN|SB|ID)\s*[:\/\\=\-\s]*([A-Za-z][A-Za-z0-9_-]{1,17})/i);
    if (m && !isQrNoise(m[1])) return m[1].toUpperCase();
    var g = v.match(/(?:^|[^A-Za-z0-9])(?:dustbin|bin|device)\s*[=:\s]+\s*([A-Za-z][A-Za-z0-9_-]{1,17})(?:$|[^A-Za-z0-9_-])/i);
    if (g) return g[1].toUpperCase();
    /* plain printed IDs: DB007, SEFERGT, db00010, SMB-0042 (letter-only codes
       such as SEFERGT are valid municipality bin IDs) */
    var bare = v.match(/^(?:[A-Za-z]{1,4}[-_ ]?\d{1,8}|[A-Za-z]{3,8})$/);
    if (bare && !isQrNoise(bare[0])) return bare[0].replace(/[- _]/g, '').toUpperCase();
    /* embedded token inside longer strings — only accept a strong ID shape:
       <letters><digits> or <letters><sep><digits> (e.g. DB007, SMB-0042) */
    var tok = v.match(/\b[A-Za-z]{1,4}[-_]?\d{1,8}\b/i);
    if (tok && !isQrNoise(tok[0])) return tok[0].replace(/[- _]/g, '').toUpperCase();
    return null;
  }
  function isQrNoise(s) {
    var low = String(s || '').toLowerCase();
    if (!low) return true;
    return ['http', 'https', 'www', 'smartbin', 'dustbin', 'bin', 'sb'].indexOf(low) !== -1;
  }

  function findBinById(id) {
    var up = String(id || '').toUpperCase();
    var list = (Array.isArray(BINS) ? BINS : []);
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].dustbin_id).toUpperCase() === up) return list[i];
    }
    return null;
  }

  /* Shared identification used by BOTH the QR flow and manual entry.
     Fast path: the in-memory BINS list.
     Miss: refresh from the SAME live /dustbins/ source the municipality
     panel uses, so bins registered after this page loaded are never
     reported as "not found". Never fakes a result. */
  var _binsLive = null, _binsLiveAt = 0;
  function fetchBinsLive() {
    var now = Date.now();
    if (_binsLive && now - _binsLiveAt < 45000) return _binsLive;
    _binsLiveAt = now;
    _binsLive = api.get('/dustbins/').then(function (b) {
      var arr = Array.isArray(b) ? b : (b.value || []);
      if (Array.isArray(arr)) BINS = arr;   // keep the dashboard in sync
      return arr;
    }, function () { _binsLive = null; return null; });
    return _binsLive;
  }
  function identifyBin(id) {
    return new Promise(function (resolve) {
      var bin = findBinById(id);
      if (bin) { console.log('Matched bin:', bin); resolve(bin); return; }
      fetchBinsLive().then(function (arr) {
        var bin2 = (Array.isArray(arr) && findBinById(id)) || null;
        console.log('Matched bin:', bin2);
        resolve(bin2);
      }).catch(function () { console.log('Matched bin:', null); resolve(null); });
    });
  }

  function isSecureContext() {
    if (window.isSecureContext !== undefined) return !!window.isSecureContext;
    var h = String(window.location.hostname || '');
    return window.location.protocol === 'https:' || h === 'localhost' || h === '127.0.0.1' || h.endsWith('.localhost');
  }

  var _qrLibPromise = null;
  function loadJsQR() {
    if (typeof window.jsQR === 'function') return Promise.resolve();
    if (_qrLibPromise) return _qrLibPromise;
    _qrLibPromise = new Promise(function (res, rej) {
      // Local copy first (no network needed), then CDN as a fallback.
      var srcs = ['assets/js/jsqr-1.4.0.js', 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'];
      var i = 0;
      (function tryNext() {
        if (typeof window.jsQR === 'function') { res(); return; }
        if (i >= srcs.length) {
          // leave the cache clear so a later "Try Again" can retry loading
          _qrLibPromise = null;
          rej(new Error('QR reader could not be loaded'));
          return;
        }
        var s = document.createElement('script');
        s.src = srcs[i++];
        s.onload = function () { if (typeof window.jsQR === 'function') res(); else tryNext(); };
        s.onerror = tryNext;
        document.head.appendChild(s);
      })();
    });
    return _qrLibPromise;
  }

  /* ---- Shared unload core (used by BOTH the QR flow and manual entry).

  function setUnloadBusy(on, label) {
    scanBusy = on;

    if (rec) { rec.disabled = on; rec.textContent = on ? (label || 'Recording...') : 'Record Collection'; }
    var un = document.getElementById('unloadNow');

  }

  async function performUnload(bin) {
    if (!bin || scanBusy) return false;
    var dustbinId = String(bin.dustbin_id || '').toUpperCase();
    var fromPct = Math.round(bin.fill_level || 0);
    if (fromPct <= MIN_COLLECT_FILL) {
      showToast(dustbinId + ' is only ' + fromPct + '% full \u2014 collection requires more than ' + MIN_COLLECT_FILL + '% full. No points were added.', 'error');
      return false;
    }
    setUnloadBusy(true, 'Recording unload...');
    try {
      if (CUR_TASK && activeTask()) {
        if (String(CUR_TASK.dustbin_code || '').toUpperCase() !== dustbinId) {
          showToast('Wrong dustbin \u2014 your current task is ' + String(CUR_TASK.dustbin_code).toUpperCase() + '. No unload was recorded.', 'error');
          setUnloadBusy(false); return false;
        }
        if (String(CUR_TASK.status || '').toUpperCase() === 'COMPLETED') {
          showToast('Collection already recorded for this task.', 'info');
          setUnloadBusy(false); showUnloadSuccess(CUR_TASK.dustbin_code, fromPct); return true;
        }
        var done = await api.post('/tasks/' + CUR_TASK.task_id + '/complete', { waste_type: 'Dry Recyclable' });
        CUR_TASK = done;
        pollCurrentTask();
        showUnloadSuccess(CUR_TASK.dustbin_code, fromPct);
      } else {
        var already = (MYCOLLS || []).some(function (c) { return String(c.dustbin_code || '').toUpperCase() === dustbinId; });
        if (already) {
          showToast('Collection already recorded for this bin.', 'info');
          setUnloadBusy(false); showUnloadSuccess(dustbinId, fromPct); return true;
        }
        var res = await api.post('/collections/', { driver_id: DRIVER && DRIVER.id, dustbin_id: dustbinId, waste_type: 'Dry Recyclable' });
        showUnloadSuccess(res.dustbin_code, fromPct);
      }
      refreshDriverData();
      setBadges();
      return true;
    } catch (e) {
      showToast((e && e.message) || 'Unload failed', 'error');
      setUnloadBusy(false);
      return false;
    }
  }

  function closeScanner() {
    var s = activeScanner;
    if (s && typeof s.close === 'function') { try { s.close(); } catch (e) {} }

  /* ---- Real camera scanner ---- */
  // opts.onDecoded(res): optional route-aware handler. When provided, a
  // successfully decoded REGISTERED bin defers to it (res = {raw, id, bin})
  // instead of the default Scan & Unload result panel. Invalid/unregistered
  // QR outcomes still use the built-in overlays so the camera UX is shared.
  function openScanner(opts) {
    closeScanner();                       // never two scanners at once
    var ov = document.createElement('div');
    ov.className = 'drsc-ov';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-modal', 'true');
    ov.innerHTML =
      '<div class="drsc-head"><b>SCAN DUSTBIN QR</b>' +
      '<button type="button" class="drsc-x" aria-label="Close scanner">&#10005;</button></div>' +
      '<div class="dr-cam drsc-cam">' +
      '  <video autoplay playsinline muted></video>' +
      '  <i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i>' +
      '  <div class="ai-scanline"></div>' +
      '  <div class="drsc-frame"><b>SCAN HERE</b></div>' +
      '</div>' +
      '<div class="drsc-status pre"><i class="d"></i><span class="t"></span><span class="s"></span></div>' +
      '<div class="drsc-actions"></div>' +
      '<div class="drsc-foot">Align the SmartBin QR code inside the frame</div>';
    document.body.appendChild(ov);

    var vid = ov.querySelector('video');
    var statusEl = ov.querySelector('.drsc-status');
    var statusT = ov.querySelector('.drsc-status .t');
    var statusS = ov.querySelector('.drsc-status .s');
    var actionsBox = ov.querySelector('.drsc-actions');
    var snap = document.createElement('canvas');
    var activeStream = null;
    var loopTimer = null;
    var scanning = false;
    var disposed = false;

    function setStatus(mode, title, sub) {
      statusEl.className = 'drsc-status ' + mode;
      statusT.textContent = title || '';
      statusS.textContent = sub || '';
    }
    function setActions(btns, h) {
      actionsBox.innerHTML = btns.map(function (b) {
        return '<button type="button" class="drsc-btn ' + (b.kind || '') + '" data-k="' + b.k + '">' + b.label + '</button>';
      }).join('');
      actionsBox.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var handler = h[btn.getAttribute('data-k')];
          if (handler) handler();
        });
      });
    }
    function stopTracks() {
      if (vid.srcObject) {
        try { (vid.srcObject.getTracks() || []).forEach(function (t) { t.stop(); }); } catch (e) {}
        vid.srcObject = null;
      }
      activeStream = null;
    }
    function haltLoop() {
      if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
      scanning = false;
    }
    function sClose() {
      if (disposed) return;
      disposed = true;
      haltLoop();
      stopTracks();
      document.removeEventListener('keydown', onKeyDown);
      if (activeScanner === s) activeScanner = null;
      ov.classList.add('out');
      setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 230);
    }

    function startCamera() {
      if (disposed) return;
      haltLoop();
      if (!isSecureContext()) {
        setStatus('error', 'SECURE CONTEXT REQUIRED', 'Camera access requires a secure browser context. Use localhost or HTTPS.');
        setActions([{ k: 'try', label: 'Try Again' }], H);
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('error', 'NOT SUPPORTED', 'Camera scanning is not supported in this browser.');
        setActions([{ k: 'close', label: 'Close' }], H);
        return;
      }
      setStatus('init', 'INITIALIZING', 'Starting camera\u2026');
      setActions([{ k: 'close', label: 'Cancel' }], H);
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      }).then(function (stream) {
        if (disposed) { (stream.getTracks() || []).forEach(function (t) { t.stop(); }); return; }
        activeStream = stream;
        vid.srcObject = stream;
        return vid.play().catch(function () {}).then(function () {
          return new Promise(function (res) {
            var done2 = false, t2 = null;
            function ok() { if (done2) return; done2 = true; if (t2) clearTimeout(t2); res(); }
            if (vid.readyState >= 2) return ok();
            vid.addEventListener('loadeddata', ok);
            vid.addEventListener('playing', ok);
            t2 = setTimeout(function () { vid.removeEventListener('loadeddata', ok); vid.removeEventListener('playing', ok); ok(); }, 2500);
          });
        });
      }).then(function () {
        if (disposed) return;
        setStatus('scan', 'SCANNING', 'Point the camera at the QR code.');
        setActions([{ k: 'close', label: 'Cancel' }], H);
        scanning = true;
        startLoop();
      }).catch(function (e) {
        if (disposed) return;
        var name = (e && e.name) || '';
        var map = {
          NotAllowedError: ['error', 'PERMISSION DENIED', 'Camera permission was denied. Enable camera access in your browser settings.'],
          SecurityError: ['error', 'PERMISSION DENIED', 'Camera permission was denied. Enable camera access in your browser settings.'],
          NotFoundError: ['error', 'NO CAMERA DETECTED', 'No camera was detected on this device.'],
          OverconstrainedError: ['error', 'NO CAMERA DETECTED', 'No camera was detected on this device.'],
          NotReadableError: ['error', 'CAMERA BUSY', 'Your camera is currently being used by another application.'],
          TypeError: ['error', 'NOT SUPPORTED', 'Camera scanning is not supported in this browser.']
        };
        var m = map[name] || ['error', 'CAMERA ERROR', 'Unable to start the camera.'];
        setStatus(m[0], m[1], m[2]);
        setActions([{ k: 'try', label: 'Try Again' }, { k: 'close', label: 'Close' }], H);
      });
    }

    function startLoop() {
      var useNative = false, det = null;
      var qrLibReady = false, qrLibFailed = false;
      try {
        if (window.BarcodeDetector) {
          var supported = [];
          if (typeof window.BarcodeDetector.getSupportedFormats === 'function') supported = window.BarcodeDetector.getSupportedFormats();
          if (Array.isArray(supported) && supported.length && supported.indexOf('qr_code') === -1) {
            useNative = false;
          } else {
            det = new window.BarcodeDetector({ formats: ['qr_code'] });
            useNative = true;
          }
        }
      } catch (e) { useNative = false; }

      // HYBRID DECODER: native BarcodeDetector OR jsQR, whichever succeeds.
      // Desktop Chrome's native detector often returns [] forever while the
      // camera works, so we ALWAYS keep jsQR armed and fall back to it on the
      // same frame when native yields nothing.
      loadJsQR().then(function () { qrLibReady = true; log('jsqr ready'); })
        .catch(function () { qrLibFailed = true; log('jsqr failed to load'); });

      var work = document.createElement('canvas');
      var workCtx = work.getContext('2d', { willReadFrequently: true });
      var lastResult = '', lastResultAt = 0, emptyNativeStreak = 0;

      function log() { if (SMB_SCAN_DEBUG) { try { console.debug('[scan]', [].slice.call(arguments)); } catch (e) {} } }

      // Draw (optionally cropped) frame into a bounded canvas and run jsQR.
      function decodeImage(img, sx, sy, sw, sh) {
        var MAX = 1024;
        var scale = Math.min(1, MAX / Math.max(sw, sh));
        var dw = Math.max(1, Math.round(sw * scale)), dh = Math.max(1, Math.round(sh * scale));
        work.width = dw; work.height = dh;
        workCtx.clearRect(0, 0, dw, dh);
        workCtx.drawImage(img, sx, sy, sw, sh, 0, 0, dw, dh);
        try {
          var idt = workCtx.getImageData(0, 0, dw, dh);
          var code = window.jsQR(idt.data, dw, dh, { inversionAttempts: 'attemptBoth' });
          return (code && code.data) ? code.data : null;
        } catch (e) { return null; }
      }
      // Last-resort pass: stretch contrast and re-run jsQR for glare/low-contrast QRs.
      function decodeContrast() {
        var w = vid.videoWidth || 0, h = vid.videoHeight || 0;
        if (!(w && h)) return null;
        var MAX = 1024;
        var scale = Math.min(1, MAX / Math.max(w, h));
        var dw = Math.max(1, Math.round(w * scale)), dh = Math.max(1, Math.round(h * scale));
        work.width = dw; work.height = dh;
        workCtx.clearRect(0, 0, dw, dh);
        workCtx.drawImage(vid, 0, 0, w, h, 0, 0, dw, dh);
        try {
          var idt = workCtx.getImageData(0, 0, dw, dh), d = idt.data;
          var min = 255, max = 0;
          for (var i = 0; i < d.length; i += 4) {
            var lum = (d[i] + d[i + 1] + d[i + 2]) / 3;
            if (lum < min) min = lum;
            if (lum > max) max = lum;
          }
          var span = Math.max(1, max - min);
          for (i = 0; i < d.length; i += 4) {
            d[i] = (d[i] - min) / span * 255;
            d[i + 1] = (d[i + 1] - min) / span * 255;
            d[i + 2] = (d[i + 2] - min) / span * 255;
          }
          workCtx.putImageData(idt, 0, 0);
          var code = window.jsQR(workCtx.getImageData(0, 0, dw, dh).data, dw, dh, { inversionAttempts: 'attemptBoth' });
          return (code && code.data) ? code.data : null;
        } catch (e) { return null; }
      }
      // Full frame first, then central crop (UX guides the code into the box),
      // then a contrast-stretched pass to recover low-contrast/glare QRs.
      function tryFrame() {
        var w = vid.videoWidth || 0, h = vid.videoHeight || 0;
        if (!(w && h)) return null;
        var r = decodeImage(vid, 0, 0, w, h);
        if (r) return r;
        var cx = Math.floor(w * 0.25), cy = Math.floor(h * 0.25);
        r = decodeImage(vid, cx, cy, Math.ceil(w * 0.5), Math.ceil(h * 0.5));
        if (r) return r;
        return decodeContrast();
      }

      // Refuse to wait forever on a broken native detector.
      function withTimeout(p, ms) {
        return Promise.race([p, new Promise(function (_, rej) {
          setTimeout(function () { rej(new Error('native BarcodeDetector timed out')); }, ms);
        })]);
      }

      function tick() {
        if (!scanning || disposed) return;
        var accepted = false;
        function accept(v) {
          if (accepted || !scanning || disposed) return;
          accepted = true;
          if (v === lastResult && Date.now() - lastResultAt < 3000) { log('duplicate value ignored', v); accept(null); return; }
          lastResult = v; lastResultAt = Date.now();
          onDecoded(v);
        }
        function schedule() { loopTimer = setTimeout(tick, 140); }

        try {
          if (useNative) {
            withTimeout(det.detect(vid), 1500).then(function (rs) {
              if (!scanning || disposed) return;
              if (rs && rs.length && rs[0] && rs[0].rawValue) { log('native decode'); accept(rs[0].rawValue); return; }
              emptyNativeStreak++;
              log('native empty x' + emptyNativeStreak);
              if (qrLibReady && typeof window.jsQR === 'function') {
                var v = tryFrame();
                if (v) { log('jsQR fallback decode'); accept(v); return; }
                schedule(); return;
              }
              if (qrLibFailed && emptyNativeStreak >= 10) {
                setStatus('error', 'QR READER UNAVAILABLE', 'Could not load the QR reader library. Check your network connection and try again.');
                setActions([{ k: 'try', label: 'Try Again' }, { k: 'close', label: 'Close' }], H);
                scanning = false; return;
              }
              schedule();
            }).catch(function (e2) {
              useNative = false; log('native threw/timed out, switched to jsQR', e2 && e2.message);
              if (!scanning || disposed) return;
              schedule();
            });
          } else if (qrLibReady && typeof window.jsQR === 'function') {
            var v = tryFrame();
            if (v) { log('jsQR decode'); accept(v); return; }
            schedule();
          } else if (qrLibFailed) {
            setStatus('error', 'QR READER UNAVAILABLE', 'Could not load the QR reader library. Check your network connection and try again.');
            setActions([{ k: 'try', label: 'Try Again' }, { k: 'close', label: 'Close' }], H);
            scanning = false;
          } else {
            // reader library still loading: tell the user instead of silent scanning
            if (!loadingHinted && Date.now() - loopStartAt > 2000) { loadingHinted = true; setStatus('scan', 'SCANNING', 'Loading QR reader...'); }
            schedule();
          }
        } catch (e3) {
          // Never let the scan loop die silently - surface it instead.
          log('scan loop error', e3 && e3.message);
          if (!scanning || disposed) return;
          setStatus('error', 'CAMERA ERROR', 'Unable to process the camera feed. Please try again.');
          setActions([{ k: 'try', label: 'Try Again' }, { k: 'close', label: 'Close' }], H);
          scanning = false;
        }
      }
      var loopStartAt = Date.now(), loadingHinted = false;
      tick();
    }

    function onDecoded(raw) {
      if (disposed || !scanning) return;
      haltLoop();                       // single scan only (no duplicates)
      console.log('QR detected:', raw);
      setStatus('detected', 'QR CODE DETECTED', 'Checking SmartBin...');
      var id = parseScanValue(raw);
      console.log('Parsed bin ID:', id);
      if (!id) {
        setStatus('error', 'ERROR', 'Unable to read this QR code.');
        setActions([{ k: 'again', label: 'Scan Again' }, { k: 'close', label: 'Close' }], H);
        return;
      }
      identifyBin(id).then(function (bin) {
        if (disposed) return;
        if (!bin) {                       // not a registered SmartBin
          setStatus('error', 'INVALID SMARTBIN QR', 'This QR code is not associated with a registered SmartBin.');
          setActions([{ k: 'again', label: 'Scan Again' }, { k: 'close', label: 'Close' }], H);
          return;
        }
        if (opts && typeof opts.onDecoded === 'function') {
          // route-aware flow: resolve to the caller, then close the camera
          haltLoop();
          stopTracks();
          setStatus('valid', 'VALIDATING', 'Checking SmartBin...');
          setTimeout(function () {
            if (disposed) return;
            closeScanner();
            opts.onDecoded({ raw: raw, id: id, bin: bin });
          }, 260);
          return;
        }
        var cur = (activeTask() && CUR_TASK) ? CUR_TASK : null;
        if (cur && String(cur.dustbin_code).toUpperCase() !== String(id).toUpperCase()) {
          setStatus('error', 'WRONG BIN', 'You scanned ' + id + ', but your current collection task is ' + String(cur.dustbin_code).toUpperCase() + '. No unload was recorded.');
          setActions([{ k: 'again', label: 'Scan Again' }, { k: 'close', label: 'Close' }], H);
          return;
        }
        setStatus('valid', 'VALIDATING', 'Checking SmartBin...');
        setTimeout(function () {
          if (disposed) return;
          setStatus('success', 'SMARTBIN VERIFIED', 'SmartBin verified.');
          var inp = document.getElementById('sDustbin');
          if (inp) inp.value = id;
          haltLoop();
          stopTracks();
          closeScanner();
          renderBinDetails(bin, !!cur);
        }, 320);
      });
    }

    function onKeyDown(e) { if (e.key === 'Escape') sClose(); }

    var H = {
      try: startCamera,                       // full restart (permission/errors)
      again: function () {                    // Scan Again: same camera, restarted decoder
        setStatus('scan', 'SCANNING', 'Point the camera at the QR code.');
        setActions([{ k: 'close', label: 'Cancel' }], H);
        scanning = true;
        startLoop();
      },
      close: sClose
    };
    var s = { close: sClose, retry: startCamera };

    document.addEventListener('keydown', onKeyDown);
    ov.querySelector('.drsc-x').addEventListener('click', sClose);
    if (isSecureContext() && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      setStatus('pre', 'CAMERA REQUIRED', 'Allow camera access to scan the dustbin QR code.');
    } else if (!isSecureContext()) {
      setStatus('error', 'SECURE CONTEXT REQUIRED', 'Camera access requires a secure browser context. Use localhost or HTTPS.');
    } else {
      setStatus('error', 'NOT SUPPORTED', 'Camera scanning is not supported in this browser.');
    }
    setActions([{ k: 'try', label: 'Enable Camera' }], H);
    activeScanner = s;
  }

  function smartScan() {
    return new Promise(function (resolve) {
      var ov = document.createElement('div');
      ov.className = 'ai-scan-overlay';
      ov.innerHTML =
        '<div class="ai-camera">' +
        '  <div class="ai-cam-corners"></div>' +
        '  <div class="ai-scan-grid"></div>' +
        '  <div class="ai-scanline"></div>' +
        '  <div class="ai-frame-label">ESP32-CAM · AI Vision</div>' +
        '</div>' +
        '<div class="ai-status"><span class="ai-status-dot"></span><span>AI Analysing...</span></div>';
      document.body.appendChild(ov);
      setTimeout(function () {
        var st = ov.querySelector('.ai-status');
        st.className = 'ai-status result';
        st.innerHTML = '<span class="ai-status-dot"></span><span>Waste Detected</span>';
        var rec = document.createElement('div');
        rec.className = 'ai-recommend';
        rec.innerHTML = '<span style="font-weight:800">Rec:</span> Dry Recyclable Bin';
        ov.appendChild(rec);
      }, 1000);
      setTimeout(function () {
        ov.classList.add('out');
        setTimeout(function () { ov.remove(); resolve(); }, 430);
      }, 1900);
    });
  }

  async function driverRecordUnload() {
    // Manual entry uses the SAME validated unload core as the QR flow.
    var inp = document.getElementById('sDustbin');
    var raw = String(inp ? inp.value : '').trim();
    if (!raw) { showToast('Enter or scan a Dustbin ID first', 'error'); if (inp) inp.focus(); return; }
    var dustbinId = (parseScanValue(raw) || raw).replace(/[-\s]/g, '').toUpperCase();
    if (!dustbinId) { showToast('This is not a valid Dustbin ID', 'error'); if (inp) { inp.focus(); inp.select(); } return; }
    var bin = await identifyBin(dustbinId);
    if (!bin) {
      showToast(dustbinId + ' is not a registered SmartBin.', 'error');
      if (inp) { inp.value = ''; inp.focus(); }
      return;
    }
    await performUnload(bin);
  }

  /* ============================================================
     ---- Assigned Bins (compact fleet console) ----
     REAL data only: assignedBins() derives from BINS by the
     driver's actual assigned area/route; fill, status, priority
     and task states come straight from live backend data.
     Summary strip and table share the SAME dataset.
     ============================================================ */
  var abState = { q: '', status: 'all', pri: 'all', sort: 'urgent' };
  var abSelected = null;
  var assignedLastUpdated = null;
  var lastAssignedFetch = 0;
  var ASSIGNED_ERR = false;

  function secAgo(ts) {
    if (ts == null) return 'just now';
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 60) return s + ' sec ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    return Math.floor(s / 3600) + 'h ago';
  }

  /* ------------------------- tasks on a bin ------------------------- */
  function abTaskFor(bin) {
    var id = String(bin.dustbin_id || '').toUpperCase();
    if (CUR_TASK && String(CUR_TASK.dustbin_code || '').toUpperCase() === id) return CUR_TASK;
    var t = (TASK_ALL || []).filter(function (x) { return String(x.dustbin_code || '').toUpperCase() === id; })[0];
    return t || null;
  }
  function abTaskLabel(t) {
    if (!t) return '\u2014';
    var m = { ASSIGNED: 'ASSIGNED', ACCEPTED: 'EN ROUTE', ON_ROUTE: 'EN ROUTE', ARRIVED: 'ARRIVED', COLLECTING: 'COLLECTING', COMPLETED: 'COMPLETED' };
    return m[t.status] || String(t.status || '\u2014');
  }
  function abTaskActive(t) { return !!t && ['ASSIGNED', 'ACCEPTED', 'ON_ROUTE', 'ARRIVED', 'COLLECTING'].indexOf(t.status) !== -1; }
  function abTaskCls(label) {
    if (label === 'ASSIGNED') return 'assigned';
    if (label === 'EN ROUTE') return 'route';
    if (label === 'ARRIVED') return 'arrived';
    if (label === 'COLLECTING') return 'collecting';
    if (label === 'COMPLETED') return 'done';
    return '';
  }
  function abTaskPill(t) {
    var label = abTaskLabel(t);
    if (!t || label === '\u2014') return '<span class="ab-dash">\u2014</span>';
    return '<span class="ab-taskpill ' + abTaskCls(label) + '">' + esc(label) + '</span>';
  }

  /* ------------------------- filters / sorting ------------------------- */
  function abStatusOpts() {
    var s = {};
    assignedBins().forEach(function (b) { if (b.status) s[String(b.status).toUpperCase()] = 1; });
    return s;
  }
  function abPrioOpts() {
    var s = {};
    assignedBins().forEach(function (b) { s[priorityOf(b.fill_level)] = 1; });
    return s;
  }
  function abRealDist(bin) {
    var f = gpsState && gpsState.lastFix, r = realPos(bin);
    if (!f || !r) return 1e9;
    var d = distKm({ lat: f.lat, lng: f.lng }, r);
    return d == null ? 1e9 : d;
  }
  function abCanNearest() {
    if (!(gpsState && gpsState.lastFix)) return false;
    return assignedBins().some(function (b) { return realPos(b); });
  }
  function abSortedFiltered() {
    var q = (abState.q || '').trim().toLowerCase();
    var list = assignedBins().filter(function (b) {
      if (q && String(b.dustbin_id).toLowerCase().indexOf(q) === -1 && String(b.location || '').toLowerCase().indexOf(q) === -1) return false;
      if (abState.status !== 'all' && String(b.status || '').toUpperCase() !== abState.status) return false;
      if (abState.pri !== 'all' && priorityOf(b.fill_level) !== abState.pri) return false;
      return true;
    });
    var sorters = {
      urgent: function (a, b) {
        var p = priorityRank(b) - priorityRank(a);
        if (p) return p;
        var f = (b.fill_level || 0) - (a.fill_level || 0);
        if (f) return f;
        return a.dustbin_id < b.dustbin_id ? -1 : a.dustbin_id > b.dustbin_id ? 1 : 0;
      },
      'fill-desc': function (a, b) { return (b.fill_level || 0) - (a.fill_level || 0); },
      'fill-asc': function (a, b) { return (a.fill_level || 0) - (b.fill_level || 0); },
      'id-asc': function (a, b) { return a.dustbin_id < b.dustbin_id ? -1 : a.dustbin_id > b.dustbin_id ? 1 : 0; },
      'id-desc': function (a, b) { return a.dustbin_id > b.dustbin_id ? -1 : a.dustbin_id < b.dustbin_id ? 1 : 0; },
      'loc-asc': function (a, b) { var x = String(a.location || '').localeCompare(String(b.location || '')); return x || (a.dustbin_id < b.dustbin_id ? -1 : 1); },
      nearest: function (a, b) { return abRealDist(a) - abRealDist(b); }
    };
    var fn = sorters[abState.sort] || sorters.urgent;
    return list.slice().sort(fn);
  }

  function abStatusCls(st, pct) {
    var s = String(st || '').toUpperCase();
    if (s === 'OFFLINE') return 'off';
    if (s === 'FILLED') return pct >= 90 ? 'danger' : 'high';
    if (s === 'READY') return pct >= 90 ? 'danger' : 'ready';
    if (s === 'EMPTY') return 'ok';
    return pct >= 90 ? 'danger' : (pct >= 80 ? 'high' : 'ready');
  }

  /* ------------------------- building blocks ------------------------- */
  function abSummary() {
    var list = assignedBins();
    var u = 0, h = 0, n = 0;
    list.forEach(function (b) {
      var p = priorityOf(b.fill_level);
      if (p === 'URGENT') u++; else if (p === 'HIGH') h++; else n++;
    });
    var area = (DRIVER && DRIVER.assigned_area) || 'All areas';
    function card(v, l, c) { return '<div class="ab-stat ' + c + '"><b>' + v + '</b><span>' + l + '</span></div>'; }
    return '<div class="ab-strip">' +
      card(list.length, 'ASSIGNED', 'blue') +
      card(u, 'URGENT', 'red') +
      card(h, 'HIGH', 'amber') +
      card(n, 'NORMAL', 'green') +
      card(esc(area), 'AREA', 'cyan') +
      '</div>';
  }

  function abFilterBar() {
    var st = abStatusOpts(), pr = abPrioOpts();
    var statusOrder = { FILLED: 1, READY: 2, EMPTY: 3, OFFLINE: 4 };
    var stOpts = ['all'].concat(Object.keys(st).sort(function (a, b) { return (statusOrder[a] || 9) - (statusOrder[b] || 9); }));
    var priOrder = { URGENT: 1, HIGH: 2, NORMAL: 3 };
    var prOpts = ['all'].concat(Object.keys(pr).sort(function (a, b) { return priOrder[a] - priOrder[b]; }));
    function optList(opts, cur) {
      return opts.map(function (s) {
        var label = s === 'all' ? 'All' : s.charAt(0) + s.slice(1).toLowerCase();
        return '<option value="' + s + '"' + (cur === s ? ' selected' : '') + '>' + label + '</option>';
      }).join('');
    }
    function sortOpts(cur) {
      var sorts = [['urgent', 'Urgent First'], ['fill-desc', 'Highest Fill'], ['fill-asc', 'Lowest Fill'], ['id-asc', 'Bin ID A\u2013Z'], ['id-desc', 'Bin ID Z\u2013A'], ['loc-asc', 'Location A\u2013Z']];
      if (abCanNearest()) sorts.push(['nearest', 'Nearest First']);
      return sorts.map(function (s) { return '<option value="' + s[0] + '"' + (cur === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('');
    }
    return '<div class="ab-toolbar">' +
      '<span class="ab-search"><input id="abQ" type="text" placeholder="\u{1F50D} Search bin ID or location..." value="' + esc(abState.q) + '" autocomplete="off">' +
      (abState.q ? '<button class="ab-clear" id="abClear" aria-label="Clear search">\u00D7</button>' : '') +
      '</span>' +
      '<span class="ab-filter"><label>Status:</label><select id="abStatus" aria-label="Filter by status" data-cur="' + abState.status + '">' + optList(stOpts, abState.status) + '</select></span>' +
      '<span class="ab-filter"><label>Priority:</label><select id="abPriority" aria-label="Filter by priority" data-cur="' + abState.pri + '">' + optList(prOpts, abState.pri) + '</select></span>' +
      '<span class="ab-sort"><label>Sort:</label><select id="abSort" aria-label="Sort bins" data-cur="' + abState.sort + '">' + sortOpts(abState.sort) + '</select></span>' +
      '<button class="ab-refresh" id="abRefresh" title="Refresh assigned bins"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></button>' +
      '<span class="ab-updated">Last updated: ' + secAgo(assignedLastUpdated) + '</span>' +
      '</div>';
  }

  function abTable(shown) {
    var head = '<div class="ab-tr ab-head"><span>BIN ID</span><span>LOCATION</span><span>PRIORITY</span><span>FILL LEVEL</span><span>STATUS</span><span>TASK STATE</span><span>ACTION</span></div>';
    var rows = shown.map(abRow).join('');
    return '<div class="glass ab-panel"><div class="ab-table">' + head + rows + '</div></div>';
  }

  function abRow(b) {
    var pct = Math.round(b.fill_level || 0);
    var pr = priorityOf(b.fill_level);
    var sel = abSelected === b.dustbin_id ? ' sel' : '';
    var edge = pr === 'URGENT' ? ' ab-edge-u' : (pr === 'HIGH' ? ' ab-edge-h' : '');
    var task = abTaskFor(b);
    var st = String(b.status || '\u2014').toUpperCase();
    return '<div class="ab-tr' + sel + edge + '" data-bin="' + esc(b.dustbin_id) + '">' +
      '<span class="ab-bin"><b>' + esc(b.dustbin_id) + '</b></span>' +
      '<span class="ab-loc" title="' + esc(b.location || '') + '">' + esc(b.location || '\u2014') + '</span>' +
      '<span><span class="ab-pri ' + pCls(pr) + '">' + pr + '</span></span>' +
      '<span class="ab-fill"><span class="ab-bar"><span class="' + binFillCls(pct) + '" style="width:' + Math.min(100, pct) + '%"></span></span><b>' + pct + '%</b></span>' +
      '<span><span class="ab-status ' + abStatusCls(st, pct) + '">' + esc(st) + '</span></span>' +
      '<span>' + abTaskPill(task) + '</span>' +
      '<span><button class="ab-view" data-detail="' + esc(b.dustbin_id) + '">View Details \u2192</button></span>' +
      '</div>';
  }

  function abNoResults() {
    return '<div class="glass ab-panel"><div class="ab-state"><b>NO BINS FOUND</b><p>No assigned bins match your current filters.</p><button class="ab-go" data-ab-clear-filters="1">Clear Filters</button></div></div>';
  }
  function abEmpty() {
    return '<div class="glass ab-panel"><div class="ab-state"><b>NO ASSIGNED BINS</b><p>Bins assigned to your area will appear here.</p><button class="ab-go" data-goto="dashboard">View Dashboard</button></div></div>';
  }
  function abError() {
    return '<div class="glass ab-panel"><div class="ab-state err"><b>UNABLE TO LOAD ASSIGNED BINS</b><p>Something went wrong while loading your assigned bins.</p><button class="ab-go" id="abRetry">Try Again</button></div></div>';
  }
  function abSkeleton() {
    var rows = '';
    for (var i = 0; i < 4; i++) {
      rows += '<div class="ab-sk"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>';
    }
    return '<div class="ab-toolbar"><span class="ab-sk-search"></span><span class="ab-sk-chip"></span><span class="ab-sk-chip"></span><span class="ab-sk-chip"></span><span class="ab-sk-chip"></span></div>' +
      '<div class="glass ab-panel"><div class="ab-table">' + rows + '</div></div>' +
      '<p class="ab-loading-txt">Loading assigned bins\u2026</p>';
  }

  /* ------------------------- main renderer ------------------------- */
  function renderAssigned() {
    if (assignedLastUpdated == null) assignedLastUpdated = Date.now();
    var host = document.getElementById('dViewHost');
    var list = assignedBins();
    document.getElementById('assignBadge').textContent = list.length;
    var html = abSummary();
    if (ASSIGNED_ERR) {
      html += '<div id="abBody"><div class="ab-errwrap">' + abError() + '</div></div>';
    } else if (!dataReady) {
      html += '<div id="abBody">' + abSkeleton() + '</div>';
    } else if (!list.length) {
      html += '<div id="abBody">' + abEmpty() + '</div>';
    } else {
      html += abFilterBar() + '<div id="abBody"></div>';
    }
    host.innerHTML = html;
    abRenderBody();

  /* ------------------------- data refresh ------------------------- */
  async function abDataRefresh() {

    try {
      var b = await api.get('/dustbins/');

      var ta = await api.get('/tasks/driver/' + DRIVER.id);

  }
  async function refreshAssignedLive() {
    if (!DRIVER || !DRIVER.id || currentView !== 'assigned') return;
    lastAssignedFetch = Date.now();
    try {
      var b = await api.get('/dustbins/');
      BINS = (Array.isArray(b) ? b : (b.value || []));
      var ta = await api.get('/tasks/driver/' + DRIVER.id);
      TASK_ALL = (Array.isArray(ta) ? ta : (ta.value || []));

      ASSIGNED_ERR = false;
    } catch (e) { /* keep current data on failure */ }
    if (currentView !== 'assigned') return;
    document.getElementById('assignBadge').textContent = assignedBins().length;
    assignedLastUpdated = Date.now();
    var act = document.activeElement;
    if (act && act.id === 'abQ') return;   // never yank the user's search focus
    renderAssigned();
  }

  /* ============================================================
     ---- Assigned Routes (state-driven) ----
     ONE central derived routeStatus: empty | loading | ready | active |
     paused | completed | unavailable | error.
     Stops come from the real assigned-bin dataset (assignedPending);
     completion from real MYCOLLS / TASK_ALL / local task state;
     distances from real bin coordinates + real driver GPS fix only.
     ============================================================ */
  var dataReady = false;      // initial data fetch finished
  var dashErr = false;        // dashboard data failed entirely (no usable fallback)
  var routeLive = false;      // driver started the route this session
  var routePaused = false;    // driver paused an active route
  try {   // restore local route state after a refresh (data stays backend-driven)
    routeLive = localStorage.getItem('smb:routeLive') === '1';
    routePaused = localStorage.getItem('smb:routePaused') === '1';
  } catch (e) {}
  var routeBusy = false;      // route fetch / optimisation in progress
  var routeErr = null;        // 'network' | 'server' | 'data'
  var routeOpt = false;       // stops ordered by optimised run
  var lastRoutesStatus = '';  // guards GPS re-renders (no churn)

  function priorityRank(b) { var p = priorityOf(b.fill_level); return p === 'URGENT' ? 3 : p === 'HIGH' ? 2 : 1; }

  /* Collection gate: points are only awarded for a FULL / ALMOST-FULL bin.
     Empty or near-empty bins are recognised but NOT collectable. */
  var MIN_COLLECT_FILL = 80;  // % — a bin must be MORE THAN this fill level to record + award points
  function binCollectable(bin) {
    var has = bin && bin.fill_level != null;
    if (has) return (Number(bin.fill_level) || 0) > MIN_COLLECT_FILL;
    var st = String((bin && bin.status) || '').toUpperCase();
    return !/NEAR/.test(st) && /FILLED|FULL|OVERFLOW/.test(st);   // no sensor reading: only an explicitly FULL status qualifies
  }

  function routeStops() {
    var list = assignedPending().slice();
    if (!routeOpt) {
      /* default order: real priority first, then fill level, then id — never fabricates distances */
      return list.sort(function (a, b) {
        var p = priorityRank(b) - priorityRank(a);
        if (p) return p;
        var f = (b.fill_level || 0) - (a.fill_level || 0);
        if (f) return f;
        return a.dustbin_id < b.dustbin_id ? -1 : (a.dustbin_id > b.dustbin_id ? 1 : 0);
      });
    }
    /* re-optimised order: highest priority first, then nearest-next using real coords */
    list.sort(function (a, b) { return priorityRank(b) - priorityRank(a); });
    var o = [];
    if (!list.length) return o;
    o.push(list[0]);
    list.splice(0, 1);
    while (list.length) {
      var prev = o[o.length - 1], j = 0;
      for (var k = 1; k < list.length; k++) {
        var d1 = legKm(prev, list[k]), d0 = legKm(prev, list[j]);
        if (d1 != null && (d0 == null || d1 < d0)) j = k;
      }
      o.push(list[j]); list.splice(j, 1);
    }
    return o;
  }
  function realPos(b) {
    var la = parseFloat(b.latitude), ln = parseFloat(b.longitude);
    return (!isNaN(la) && !isNaN(ln)) ? { lat: la, lng: ln, real: true } : null;
  }
  function legKm(a, b) {
    var p1 = realPos(a), p2 = realPos(b);
    return (p1 && p2) ? distKm(p1, p2) : null;
  }
  function legLabel(a, b) {
    if (!a) return 'Distance unavailable';
    var km = legKm(a, b);
    return km == null ? 'Distance unavailable' : formatDist(km);
  }
  function routeKm(stops, curIdx) {
    /* sum only the real legs between consecutive stops, plus a real
       driver->first leg when the device has an actual GPS fix. */
    var km = 0, real = 0, legs = stops.length ? stops.length - 1 : 0;
    if (gpsState.lastFix && stops.length) {
      var f = realPos(stops[0]);
      if (f) { var d = distKm(gpsState.lastFix, f); if (d != null) { km += d; real++; } }
    }
    for (var i = 0; i + 1 < stops.length; i++) {
      var leg = legKm(stops[i], stops[i + 1]);
      if (leg != null) { km += leg; real++; }
    }
    return { km: km, real: real, total: legs + (gpsState.lastFix ? 1 : 0), label: real ? km.toFixed(1) + ' km' : 'Unavailable' };
  }

  function binDone(b) {
    if (tasks[b.dustbin_id] && tasks[b.dustbin_id].state === 'collected') return true;
    if ((MYCOLLS || []).some(function (c) { return c.dustbin_code === b.dustbin_id; })) return true;
    return (TASK_ALL || []).some(function (t) { return t.dustbin_code === b.dustbin_id && String(t.status || '').toUpperCase() === 'COMPLETED'; });
  }
  function routeCollectable(stops) { return stops.filter(function (b) { return (b.status || '').toUpperCase() !== 'OFFLINE'; }); }
  function routeDone(stops) { return stops.filter(binDone).length; }
  function activeTask() { return CUR_TASK && ['ASSIGNED', 'ACCEPTED', 'ON_ROUTE', 'ARRIVED', 'COLLECTING'].indexOf(CUR_TASK.status) !== -1; }
  function todayPoints() {
    var today = new Date().toISOString().slice(0, 10);
    return (MYCOLLS || []).filter(function (c) { return (c.collected_at || '').slice(0, 10) === today; }).reduce(function (a, c) { return a + (c.points || 0); }, 0);
  }
  function routeStatus() {
    if (routeErr) return 'error';
    if (routeBusy || !dataReady) return 'loading';
    var stops = routeStops();
    var collectable = routeCollectable(stops);
    var done = routeDone(stops);
    var act = activeTask();
    if (act) {
      if (shiftState() === 'offline' || (gpsState.denied && CUR_TASK.status !== 'COLLECTING')) return 'unavailable';
      if (routePaused || shiftState() === 'break') return 'paused';
      return 'active';
    }
    if (routeLive) {
      if (gpsState.denied || shiftState() === 'offline') return 'unavailable';
      if (routePaused || shiftState() === 'break') return 'paused';
      return 'active';
    }
    if (!collectable.length) return (done || (MYCOLLS || []).length) ? 'completed' : 'empty';
    if (routeDone(collectable) === collectable.length) return 'completed';
    if (gpsState.denied) return 'unavailable';
    if (shiftState() === 'offline' || shiftState() === 'break') return 'unavailable';
    return 'ready';
  }
  function routeCurrentIdx(stops) {
    if (activeTask()) {
      var c = CUR_TASK.dustbin_code;
      for (var i = 0; i < stops.length; i++) if (stops[i].dustbin_id === c) return i;
      var d = routeDone(stops);
      return d < stops.length ? d : Math.max(0, stops.length - 1);
    }
    /* first pending stop that is actually collectable (skips done + OFFLINE bins) */
    for (var j = 0; j < stops.length; j++) {
      if (!binDone(stops[j]) && (stops[j].status || '').toUpperCase() !== 'OFFLINE') return j;
    }
    var n = routeDone(stops);
    return n < stops.length ? n : Math.max(0, stops.length - 1);
  }
  function routeReason() {
    if (shiftState() === 'offline') return {
      badge: 'DRIVER OFFLINE', text: 'Route cannot be started while your driver status is Offline.', btn: 'Go Available', act: 'dr-avail'
    };
    if (shiftState() === 'break') return {
      badge: 'ON BREAK', text: 'Route cannot be started while you are on break.', btn: 'Go Available', act: 'dr-avail'
    };
    if (gpsState.denied) return {
      badge: 'LOCATION REQUIRED', text: 'Enable GPS before starting this route.', btn: 'Enable Location', act: 'dr-gps'
    };
    return { badge: 'ROUTE UNAVAILABLE', text: 'This route cannot be started right now.', btn: 'Go Available', act: 'dr-avail' };
  }
  function routeUnavMeta() {
    /* Distinguish WHY a route can't run right now, using real state only.
       Never invents a GPS fix — Distances/ETA stay Unavailable. */
    if (shiftState() === 'offline') return {
      kind: 'offline', badge: 'DRIVER OFFLINE', text: 'Route cannot be started while your driver status is Offline.', btn: 'Go Available', act: 'dr-avail',
      note: 'Set your driver status to Available to start this route.'
    };
    if (shiftState() === 'break') return {
      kind: 'break', badge: 'ON BREAK', text: 'Route cannot be started while you are on break.', btn: 'Go Available', act: 'dr-avail',
      note: 'Return from break to start this route.'
    };
    if (gpsState.denied) return {
      kind: 'denied', badge: 'LOCATION PERMISSION DENIED', text: 'Enable location access in your browser settings to start this route.', btn: 'Try Again', act: 'dr-gps',
      note: 'Enable GPS to start this route.'
    };
    if (gpsState.running && !gpsState.lastFix) return {
      kind: 'loc', badge: 'LOCATION UNAVAILABLE', text: 'Your current location could not be detected.', btn: 'Try Again', act: 'dr-gps',
      note: 'Enable GPS to start this route.'
    };
    return {
      kind: 'gps', badge: 'GPS REQUIRED', text: 'Enable location to start navigation and share your live position with the municipality.', btn: 'Enable Location', act: 'dr-gps',
      note: 'Enable GPS to start this route.'
    };
  }
  function drGpsWarn(m) {
    var ic = (m.kind === 'offline' || m.kind === 'break') ? '&#128682;' : '&#128204;';
    return '<div class="glass dr-gps"><span class="dr-gps-ic">' + ic + '</span>' +

    var map = {

  function drStatePanel(icon, title, text, actions) {

  function drPrimD(label) { return '<button class="dr-btn" type="button" disabled>' + label + '</button>'; }

  function routeDistLabel(stops, curIdx) {
    var km = routeKm(stops);
    if (km.real) return km.label;
    if (CUR_TASK && activeTask() && CUR_TASK.distance_km != null) {
      var cur = stops[curIdx];

  }

  /* ---- header strip: GPS pill + live clock (spec header) ---- */
  function drClockStr() { var n = new Date(); return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); }
  function gpsStatus() {
    if (typeof navigator !== 'undefined' && !navigator.geolocation) return 'disabled';
    if (gpsState.denied) return 'denied';

  }

  /* ---- single driver/route status banner (one message, one action) ---- */
  function drStatusBanner(status) {
    var s = shiftState();
    var right;
    if (s === 'offline') {
      return '<div class="dr-banner off"><span class="dr-banner-ic">&#128308;</span>' +
        '<div class="dr-banner-body"><b>DRIVER OFFLINE</b><p>You will not receive route assignments while offline. Go available to start your route.</p></div>' +
        '<div class="dr-banner-actions">' + drPrim('Go Available', 'data-dr="avail"') + '</div></div>';
    }
    if (s === 'break') {
      return '<div class="dr-banner paused"><span class="dr-banner-ic">&#128682;</span>' +
        '<div class="dr-banner-body"><b>ON BREAK</b><p>You are on break. Go available to start your route.</p></div>' +
        '<div class="dr-banner-actions">' + drPrim('Go Available', 'data-dr="avail"') + '</div></div>';

    var gps = gpsStatus();
    if (gps === 'denied') {
      return '<div class="dr-banner gps"><span class="dr-banner-ic">&#128204;</span>' +
        '<div class="dr-banner-body"><b>LOCATION REQUIRED</b><p>Enable location to start navigation and share your position on this route.</p></div>' +
        '<div class="dr-banner-actions">' + drPrim('Enable Location', 'data-dr="gps"') + '</div></div>';
    }
    if (gps === 'searching' || gps === 'error') {
      return '<div class="dr-banner gps"><span class="dr-banner-ic">&#128204;</span>' +
        '<div class="dr-banner-body"><b>' + (gps === 'error' ? 'GPS OFFLINE' : 'LOCATING\u2026') + '</b><p>' + (gps === 'error' ? 'The GPS signal was lost. You can still view the route.' : 'Waiting for a GPS fix. You can still view the route while we locate you.') + '</p></div>' +
        '<div class="dr-banner-actions">' + drPrim('Enable Location', 'data-dr="gps"') + '</div></div>';
    }
    var msg = status === 'ready' ? 'You are ready to start your assigned route.'
      : status === 'active' ? 'You are ready to continue your collection route.'
      : status === 'paused' ? 'Your route is paused. Resume when you are ready.'
      : status === 'completed' ? 'All assigned stops are collected \u2014 route complete.'
      : status === 'empty' ? 'No bins are assigned to you yet.'
      : 'You are ready for route assignments.';
    right = '';
    if (status === 'ready') right += drPrim('Start Route', 'data-dr="start"');
    else if (status === 'active') right += drPrim('Pause Route', 'data-dr="pause"') + drPrim('End Route', 'data-dr="end"', 'danger');
    else if (status === 'paused') right += drPrim('Resume Route', 'data-dr="resume"') + drPrim('End Route', 'data-dr="end"', 'danger');
    else if (status === 'completed') right += drPrim('Return to Depot', 'data-dr="end"') + drPrim('View Collection History', 'data-nav="history"', 'ghost');
    else if (status === 'empty' || status === 'error') right += drPrim('View Assigned Bins', 'data-nav="assigned"');
    return '<div class="dr-banner ok"><span class="dr-banner-ic">&#9679;</span>' +
      '<div class="dr-banner-body"><b>DRIVER AVAILABLE</b><p>' + msg + '</p></div>' +
      (status === 'active' || status === 'paused' ? '<span class="dr-banner-tag ' + (status === 'active' ? 'live' : 'paused') + '">' + (status === 'active' ? 'ROUTE ACTIVE' : 'ROUTE PAUSED') + '</span>' : '') +
      '<div class="dr-banner-actions">' + right + '</div></div>';
  }

  /* ---- route summary: one card with four equal stats ---- */
  function drTimeEst(stops) {
    var km = routeKm(stops);
    /* real estimate only when real geometry exists; honest label otherwise (never fake) */
    if (!km.real || km.total < 1) return { label: gpsActive() ? 'Location unavailable' : 'Waiting for location', ok: false };
    var mins = Math.round((km.km / 20) * 60 + stops.length * 3);
    return { label: mins + ' min', ok: true };
  }
  function drRStat(label, val) {
    return '<div class="dr-rstat"><span>' + label + '</span><b>' + val + '</b></div>';
  }
  function drSummary(status, stops, curIdx) {
    var coll = routeCollectable(stops);
    var done = routeDone(coll), rem = Math.max(0, coll.length - done);
    var dist = routeDistLabel(coll, curIdx);
    var eta = drTimeEst(coll);
    var cells;
    if (status === 'empty') cells = [drRStat('Stops', '0'), drRStat('Distance', '\u2014'), drRStat('Est. Time', '\u2014'), drRStat('Points', '0')];
    else if (status === 'completed') cells = [drRStat('Stops', done + ' / ' + coll.length), drRStat('Distance', dist), drRStat('Est. Time', eta.label), drRStat('Points Earned', '+' + todayPoints())];
    else cells = [drRStat('Stops', coll.length), drRStat('Distance', dist), drRStat('Est. Time', eta.label), drRStat('Points', '+' + (rem * 10))];
    var reopt = (status === 'ready' || status === 'active' || status === 'paused') ? '<button class="dr-reopt" data-dr="reopt">Re-optimise</button>' : '';
    return '<div class="glass dr-rsum"><div class="dr-rsum-head"><span class="dr-rsum-ic">&#128666;</span>' +
      '<b>ASSIGNED ROUTE</b>' + reopt + '</div>' +
      '<div class="dr-rsum-cells">' + cells.join('') + '</div></div>';
  }

  function drProgress(status, stops) {
    if (status === 'empty' || status === 'error' || status === 'loading') return '';
    var coll = routeCollectable(stops);
    var done = routeDone(coll);
    var pct = coll.length ? Math.round((done / coll.length) * 100) : 100;
    return '<div class="dr-progress"><div class="dr-prog-top"><b>ROUTE PROGRESS</b>' +
      '<span>' + done + ' of ' + coll.length + ' stop' + (coll.length === 1 ? '' : 's') + ' completed &middot; ' + pct + '%</span></div>' +
      '<div class="dr-bar"><i style="width:' + pct + '%"></i></div></div>';
  }

  /* (route preview strip removed — timeline already shows the route) */

  /* ---- timeline: depot -> current -> upcoming -> done -> depot ---- */
  function mycollFor(b) {
    if (!(MYCOLLS || []).length) return null;
    for (var i = 0; i < MYCOLLS.length; i++) if (MYCOLLS[i].dustbin_code === b.dustbin_id) return MYCOLLS[i];
    return null;
  }
  function drLegEta(b, prev) {
    /* real estimate only from real geometry — never fake */
    var km = null;
    if (gpsState.lastFix && realPos(b)) km = distKm(gpsState.lastFix, realPos(b));
    if (km == null && prev) km = legKm(prev, b);
    if (km == null && CUR_TASK && activeTask() && CUR_TASK.dustbin_code === b.dustbin_id && CUR_TASK.distance_km != null) km = Number(CUR_TASK.distance_km);
    if (km == null || !isFinite(km) || km < 0) return { km: null, dist: gpsActive() ? 'Location unavailable' : 'GPS unavailable', eta: gpsActive() ? 'Location unavailable' : 'Waiting for location' };
    return { km: km, dist: formatDist(km), eta: Math.max(1, Math.round((km / 24) * 60)) + ' min' };
  }
  function drKV(k, v) { return '<span class="dr-kv"><i>' + k + '</i><b>' + v + '</b></span>'; }
  function drStop(status, curIdx, stops, i) {
    var b = stops[i];
    var pct = Math.round(b.fill_level || 0), pr = priorityOf(pct);
    var isCur = i === curIdx && !binDone(b) && (b.status || '').toUpperCase() !== 'OFFLINE';
    var offline = (b.status || '').toUpperCase() === 'OFFLINE';
    var done = binDone(b) || (status === 'completed' && !offline);
    var cls = done ? 'done' : (offline ? 'off' : (isCur ? 'cur' : 'up'));
    var node = done ? '\u2713' : (offline ? '!' : (isCur ? '\u25B8' : String(i + 1)));
    var st = (b.status || (pct >= 80 ? 'FILLED' : pct >= 40 ? 'PARTIAL' : 'EMPTY'));
    var leg = drLegEta(b, i > 0 ? stops[i - 1] : null);
    var mc = done ? mycollFor(b) : null;
    var ctime = mc ? fmtTime(mc.collected_at) : null;
    if (isCur) {
      var curRight = (status === 'unavailable')
        ? '<div class="dr-tright"><span class="dr-tag d-cur">CURRENT</span><span class="dr-sub">Actions disabled \u2014 route not ready.</span></div>'
        : '<div class="dr-tright"><button type="button" class="dr-rbtn x" data-rs="1" data-dr="nav" data-bin="' + esc(b.dustbin_id) + '">&#128205; Navigate</button>' +
          '<button type="button" class="dr-rbtn go" data-rs="1" data-dr="sccur">&#128269; Scan QR</button></div>';
      return '<div class="dr-trow cur" data-dstop="' + esc(b.dustbin_id) + '">' +
        '<span class="dr-tnode">' + node + '</span>' +
        '<div class="dr-tmain"><div class="dr-tline"><span class="dr-stopno">STOP ' + (i + 1) + '</span><strong>' + esc(b.dustbin_id) + '</strong>' +
        '<span class="dr-tag d-cur">CURRENT</span></div>' +
        '<small>' + esc(b.location || '') + '</small>' +
        '<div class="dr-tfillrow"><span class="dr-tfill"><i class="' + binFillCls(pct) + '" style="width:' + Math.min(100, pct) + '%"></i></span>' +
        '<b>' + pct + '% FULL</b></div>' +
        '<div class="dr-tmeta">' +
        drKV('Status', '<span class="dr-pri ' + pCls(st === 'FILLED' ? pr : 'normal') + '">' + esc(String(st).toUpperCase()) + '</span>') +
        drKV('Priority', '<span class="dr-pri ' + pCls(pr) + '">' + pr + '</span>') +
        drKV('Distance', leg.dist) +
        drKV('Estimated', leg.eta) +
        '</div></div>' +
        curRight + '</div>';
    }
    if (done) {
      return '<div class="dr-trow done" data-dstop="' + esc(b.dustbin_id) + '">' +
        '<span class="dr-tnode">' + node + '</span>' +
        '<div class="dr-tmain"><div class="dr-tline"><span class="dr-stopno">STOP ' + (i + 1) + '</span><strong>' + esc(b.dustbin_id) + '</strong>' +
        '<span class="dr-tag d-done">COMPLETED</span></div>' +
        '<small>' + esc(b.location || '') + '</small>' +
        '<span class="dr-done-meta">Collected ' + (ctime ? 'at ' + ctime : '') + (mc ? ' &middot; +' + (mc.points || 10) + ' pts' : ' &middot; +10 pts') + '</span></div></div>';
    }
    if (offline) {
      return '<div class="dr-trow off" data-dstop="' + esc(b.dustbin_id) + '">' +
        '<span class="dr-tnode">!</span>' +
        '<div class="dr-tmain"><div class="dr-tline"><span class="dr-stopno">STOP ' + (i + 1) + '</span><strong>' + esc(b.dustbin_id) + '</strong>' +
        '<span class="dr-tag d-off">OFFLINE</span></div><small>' + esc(b.location || '') + '</small>' +
        '<span class="dr-sub">Device offline \u2014 not collectable</span></div></div>';
    }
    /* upcoming */
    return '<div class="dr-trow up" data-dstop="' + esc(b.dustbin_id) + '">' +
      '<span class="dr-tnode">' + node + '</span>' +
      '<div class="dr-tmain"><div class="dr-tline"><span class="dr-stopno">STOP ' + (i + 1) + '</span><strong>' + esc(b.dustbin_id) + '</strong>' +
      '<span class="dr-pri ' + pCls(pr) + '">' + pr + '</span></div>' +
      '<small>' + esc(b.location || '') + '</small>' +
      '<div class="dr-tfillrow"><span class="dr-tfill"><i class="' + binFillCls(pct) + '" style="width:' + Math.min(100, pct) + '%"></i></span>' +
      '<b>' + pct + '% FULL</b></div></div>' +
      '<div class="dr-tright"><button type="button" class="dr-rbtn mini" data-rs="1" data-dr="nav" data-bin="' + esc(b.dustbin_id) + '">&#128205; Navigate</button></div></div>';
  }

  function drTimeline(status, stops, curIdx) {
    if (!stops.length) return '';
    var html = '<div class="glass d-panel dr-tlcard"><div class="dr-panel-title"><b>ROUTE TIMELINE</b>' +
      '<span>' + stops.length + ' stop' + (stops.length === 1 ? '' : 's') + ' \u00B7 DEPOT TO DEPOT</span></div><div class="dr-tl">' +
      '<div class="dr-trow node"><span class="dr-tnode dep">&#127961;</span>' +
      '<div class="dr-tmain"><div class="dr-tline"><strong>DEPOT</strong></div><small>Departure point \u2014 start of route</small></div></div>';
    stops.forEach(function (b, i) { html += drStop(status, curIdx, stops, i); });
    html += '<div class="dr-trow node"><span class="dr-tnode dep last">&#128230;</span>' +
      '<div class="dr-tmain"><div class="dr-tline"><strong>BACK TO DEPOT</strong></div><small>Route complete \u2014 return point</small></div></div></div></div>';
    return html;
  }

  function drActionBar(status, stops, curIdx) {
    var hint = '', btns;
    if (status === 'empty') {
      btns = drPrim('View Assigned Bins', 'data-nav="assigned"');
    } else if (status === 'loading') {
      btns = drPrimD('Start Route') + drPrimD('Navigate') + drPrimD('Scan QR') + drPrimD('Pause Route') + drPrimD('End Route');
      hint = 'Route actions are available once the route has loaded.';
    } else if (status === 'error') {
      btns = drPrim('Try Again', 'data-dr="retry"') + drPrim('View Assigned Bins', 'data-nav="assigned"', 'ghost');
    } else if (status === 'unavailable') {
      btns = drPrimD('Start Route') + drPrimD('Navigate') + drPrimD('Scan QR') + drPrimD('Pause Route') + drPrimD('End Route');
      hint = 'Actions are disabled while this route is not ready.';
    } else if (status === 'completed') {
      btns = drPrim('Return to Depot', 'data-dr="end"') + drPrim('View Collection History', 'data-nav="history"', 'ghost') + drPrim('View Assigned Bins', 'data-nav="assigned"', 'ghost');
      hint = 'All stops completed \u2014 return to the depot.';
    } else if (status === 'paused') {
      btns = drPrim('Resume Route', 'data-dr="resume"') + drPrim('Navigate', 'data-dr="nav" data-bin="' + esc((stops[curIdx] || {}).dustbin_id || '') + '"', 'ghost') + drPrim('Scan QR', 'data-dr="sccur"', 'ghost') + drPrim('End Route', 'data-dr="end"', 'danger');
    } else if (status === 'ready') {
      btns = drPrim('Start Route', 'data-dr="start"') + drPrimD('Navigate') + drPrimD('Scan QR') + drPrimD('Pause Route') + drPrimD('End Route');
      hint = 'Start the route to enable navigation and QR collection.';
    } else {
      btns = drPrim('Open Collection', 'data-dr="opencur"') + drPrim('Navigate', 'data-dr="nav" data-bin="' + esc((stops[curIdx] || {}).dustbin_id || '') + '"', 'ghost') +
        drPrim('Scan QR', 'data-dr="sccur"', 'ghost') + drPrim('Pause Route', 'data-dr="pause"', 'ghost') + drPrim('End Route', 'data-dr="end"', 'danger');
    }
    return '<div class="dr-abbar"><div class="dr-abar-btns">' + btns + '</div>' + (hint ? '<p class="dr-hint">' + hint + '</p>' : '') + '</div>';
  }

  function drCurCard(status, stops, curIdx) {
    if (status === 'completed') {
      return '<div class="glass d-panel dr-cur"><div class="dr-cur-head"><b>CURRENT STOP</b></div>' +
        '<div class="dr-cur-empty">&#9989; <b>ROUTE COMPLETE</b>' +
        '<p>All assigned bins have been collected. Return to the depot.</p>' +
        '<button type="button" class="dr-rbtn go" data-dr="end" data-rs="1" style="margin-top:12px;width:100%">&#128230; Return to Depot</button></div></div>';
    }
    var cur = stops[curIdx];
    if (!cur) {
      return '<div class="glass d-panel dr-cur"><div class="dr-cur-head"><b>CURRENT STOP</b></div>' +
        '<div class="dr-cur-empty"><b>' + (status === 'ready' ? 'Start the route to begin.' : 'No current stop.') + '</b>' +
        '<p>Confirm each stop with a QR scan as you go.</p></div></div>';
    }
    var pct = Math.round(cur.fill_level || 0), pr = priorityOf(pct);
    var st = (cur.status || (pct >= 80 ? 'FILLED' : pct >= 40 ? 'PARTIAL' : 'EMPTY'));
    var leg = drLegEta(cur, curIdx > 0 ? stops[curIdx - 1] : null);
    var curActions = (status === 'unavailable')
      ? '<div class="dr-cur-actions"><button class="dr-rbtn" type="button" disabled>Navigate</button>' +
        '<button class="dr-rbtn" type="button" disabled>Scan QR</button></div>'
      : '<div class="dr-cur-actions"><button type="button" class="dr-rbtn x" data-dr="nav" data-bin="' + esc(cur.dustbin_id) + '">&#128205; Navigate</button>' +
        '<button type="button" class="dr-rbtn go" data-dr="sccur">&#128269; Scan QR</button></div>';
    return '<div class="glass d-panel dr-cur">' +
      '<div class="dr-cur-head"><b>CURRENT STOP</b><span class="dr-tag d-cur">CURRENT</span></div>' +
      '<div class="dr-cur-id">' + esc(cur.dustbin_id) + '</div>' +
      '<div class="dr-cur-tags"><span class="dr-pri ' + pCls(pr) + '">' + pr + '</span><span>' + pct + '% FULL</span></div>' +
      '<p class="dr-cur-loc">' + esc(cur.location || '') + '</p>' +
      '<div class="dr-cur-fill"><span class="dr-tfill"><i class="' + binFillCls(pct) + '" style="width:' + Math.min(100, pct) + '%"></i></span></div>' +
      '<div class="dr-cur-meta">' + drKV('Status', esc(String(st).toUpperCase())) + drKV('Distance', leg.dist) + drKV('ETA', leg.eta) + '</div>' +
      curActions + '</div>';
  }

  function drMapCard(status, stops, curIdx) {
    if (!stops.length) return '';
    var pts = stops.map(realPos);
    var anyReal = pts.some(function (p) { return p; });
    var plot = '';
    if (anyReal && stops.length > 1) {
      var ok = pts.map(function (p, i) { return p ? p : stops[i]; });
      /* the driver's own position is plotted from the real fix only — never faked */
      var me = (gpsState.lastFix && typeof gpsState.lastFix.lat === 'number' && typeof gpsState.lastFix.lng === 'number') ? gpsState.lastFix : null;
      var lat = ok.map(function (p) { return p.lat; }), lng = ok.map(function (p) { return p.lng; });
      if (me) { lat.push(me.lat); lng.push(me.lng); }
      var minLng = Math.min.apply(null, lng), maxLng = Math.max.apply(null, lng), minLat = Math.min.apply(null, lat), maxLat = Math.max.apply(null, lat);
      var W = 560, H = 360, pad = 30;
      function px(p, i) {
        var x = (p.lat == null) ? (i + 0.5) / stops.length * (W - pad * 2) + pad : (p.lng - minLng) / ((maxLng - minLng) || 1) * (W - pad * 2) + pad;
        var y = (p.lat == null) ? H / 2 : (maxLat - p.lat) / ((maxLat - minLat) || 1) * (H - pad * 2) + pad;
        return [x, y];
      }
      var lines = [], circ = [], prev = null;
      for (var i = 0; i < stops.length; i++) {
        var xy = px(ok[i], i);
        if (prev) lines.push('L' + xy[0].toFixed(1) + ' ' + xy[1].toFixed(1)); else lines.push('M' + xy[0].toFixed(1) + ' ' + xy[1].toFixed(1));
        var done = binDone(stops[i]), off = (stops[i].status || '').toUpperCase() === 'OFFLINE';
        var pr2 = priorityOf(stops[i].fill_level);
        var c = done ? 'green' : off ? 'grey' : (i === curIdx ? 'cyan' : (pr2 === 'URGENT' ? 'red' : pr2 === 'HIGH' ? 'orange' : 'blue'));
        circ.push('<circle cx="' + xy[0].toFixed(1) + '" cy="' + xy[1].toFixed(1) + '" r="7" class="mk ' + c + '"/>' +
          '<text x="' + (xy[0] + 10).toFixed(1) + '" y="' + (xy[1] + 3).toFixed(1) + '">' + esc(stops[i].dustbin_id) + '</text>');
        prev = xy;
      }
      if (me) {
        var mxy = px(me, 0);
        circ.push('<circle cx="' + mxy[0].toFixed(1) + '" cy="' + mxy[1].toFixed(1) + '" r="12" class="mkme"/>' +
          '<circle cx="' + mxy[0].toFixed(1) + '" cy="' + mxy[1].toFixed(1) + '" r="5" class="mk me"/>' +
          '<text x="' + (mxy[0] + 16).toFixed(1) + '" y="' + (mxy[1] + 4).toFixed(1) + '" class="mtag">YOU</text>');
      }
      plot = '<div class="dr-map-plot"><svg class="dr-map-svg" viewBox="0 0 560 360" preserveAspectRatio="xMidYMid meet">' +
        '<path d="' + lines.join('') + '" class="mkline"/>' + circ.join('') + '</svg></div>';
    } else {
      /* no real bin coordinates — still distinguish "no data" from "no GPS"
         so the user never sees "GPS UNAVAILABLE" while the GPS is active */
      var mapNote = gpsActive()
        ? 'Position data is missing for these bins, so a plotted map cannot be drawn. Enable real bin coordinates to plot this route.'
        : 'Position data is missing for these bins and GPS is ' + (gpsStatus() === 'denied' ? 'blocked' : 'off') + '. Enable location to plot this route.';
      plot = '<div class="dr-map-plot"><div class="dr-map-empty"><span style="font-size:18px">&#128204;</span><b>' + (gpsActive() ? 'Location data unavailable' : 'GPS unavailable') + '</b>' +
        '<p>' + mapNote + '</p></div></div>';
    }
    var g = gpsStatus();
    var mapOffMsg = g === 'denied' ? 'GPS blocked — enable location to navigate.' : (g === 'searching' ? 'Locating your position\u2026' : (g === 'error' ? 'GPS signal lost — navigation may be delayed.' : ''));
    var seq = '<span class="dep">&#127961;</span>' + stops.map(function (s, i) {
      var cls = (i === curIdx && !binDone(s)) ? ' cur' : (binDone(s) ? ' done' : '');
      return '<span class="mk' + cls + '">' + esc(s.dustbin_id) + '</span>';
    }).join(' &#8594; ') + ' &#8594; <span class="dep">&#128230;</span>';
    return '<div class="glass d-panel dr-map">' +
      '<div class="dr-cur-head"><b>ROUTE MAP</b><button class="d-link" data-dr="nav">Open Navigation</button></div>' +
      (mapOffMsg ? '<div class="dr-map-off">' + mapOffMsg + '</div>' : '') +
      plot +
      '<div class="dr-map-key"><i class="red"></i>Urgent <i class="orange"></i>High <i class="blue"></i>Normal <i class="cyan"></i>Current <i class="green"></i>Done</div>' +
      '<div class="dr-map-seq">' + seq + '</div></div>';
  }

  async function reloadRoute() {
    routeBusy = true; routeErr = null;
    renderRoutes();
    try {
      var b = await api.get('/dustbins/');
      BINS = (Array.isArray(b) ? b : (b.value || []));
      if (DRIVER && DRIVER.id) {
        var ta = await api.get('/tasks/driver/' + DRIVER.id);
        TASK_ALL = (Array.isArray(ta) ? ta : (ta.value || []));
        await pollCurrentTask();
      }
      dataReady = true; routeBusy = false; routeOpt = true;
      if (currentView === 'routes') renderRoutes();
    } catch (e) {
      routeBusy = false;
      routeErr = /network|fetch|connect|internet/i.test(String(e && e.message)) ? 'network' : 'server';
      if (currentView === 'routes') renderRoutes();
    }
  }

  /* ---- route-aware QR scan (shares the driver camera scanner) ---- */
  function scanRoute() { openScanner({ onDecoded: onRouteDecoded }); }

  function onRouteDecoded(res) {
    if (!res || !res.bin) return;
    var bin = res.bin;
    if ((bin.status || '').toUpperCase() === 'OFFLINE') { openRouteScanRes(bin, 'offline', null); return; }
    if (!binCollectable(bin)) { openRouteScanRes(bin, 'empty', null); return; }
    var stops = routeStops();
    var curIdx = routeCurrentIdx(stops);
    var cur = stops[curIdx] || null;
    /* only the CURRENT stop may be collected — anything else is a WRONG BIN
       (never auto-complete a stop just because a QR was scanned) */
    if (cur && cur.dustbin_id === bin.dustbin_id) { openRouteScanRes(bin, 'collect', cur); return; }
    openRouteScanRes(bin, 'wrong', cur);
  }

  function openRouteScanRes(bin, kind, cur) {
    var pct = Math.round(bin.fill_level || 0);
    var title, headCls, body, actions;
    if (kind === 'collect') {
      title = 'SMARTBIN VERIFIED';
      headCls = 'ok';
      body = '<div class="rscan-ok">&#10003;</div>' +
        '<div class="drsc-dt-bin"><big>' + esc(bin.dustbin_id) + '</big><span>' + esc(bin.location || 'Location not provided') + '</span></div>' +
        '<div class="drsc-dt-fill"><div class="drsc-dt-filltop"><span>Fill Level</span><b>' + pct + '%</b></div>' +
        '<div class="drsc-bar"><span class="' + binFillCls(pct) + '" style="width:' + Math.min(100, pct) + '%"></span></div></div>' +

  function renderRoutes() {

    setBadges();

    lastRoutesStatus = status;
    var stops = status === 'loading' ? [] : routeStops();
    var curIdx = (status === 'empty' || status === 'completed') ? -1 : routeCurrentIdx(stops);
    var html = drHead();

    if (status === 'loading') {
      html += '<div class="glass d-panel dr-loading"><div class="dr-msg">' + (routeBusy ? 'Optimising your collection route\u2026' : 'Preparing your route\u2026') + '</div>' +
        '<div class="dr-sk dr-sk-sum"></div>' +

      host.innerHTML = html;
      drScopeClock();
      bindRoutes(host);
      if (!routeBusy) setTimeout(function () { if (currentView === 'routes') renderRoutes(); }, 260);
      return;
    }
    if (status === 'empty') {
      html += drStatusBanner(status) + drSummary('empty', stops, curIdx) +
        '<div class="dr-mgrid"><div class="dr-mleft">' +
        drStatePanel('&#9878;', 'No Route Assigned Yet', 'No bins are currently assigned to your collection area. New assigned bins will appear here as an optimised route.') +
        '</div><div class="dr-mright">' + drMapCard(status, stops, curIdx) + '</div></div>' +
        drActionBar(status, stops, curIdx);
      host.innerHTML = html;
      drScopeClock();
      bindRoutes(host);
      return;
    }
    if (status === 'error') {
      var em = routeErrMeta();
      html += drStatusBanner(status) +
        drStatePanel('&#9888;', em.title, em.text) +
        drActionBar(status, stops, curIdx);
      host.innerHTML = html;
      drScopeClock();
      bindRoutes(host);
      return;
    }
    html += drStatusBanner(status) + drSummary(status, stops, curIdx) +
      drProgress(status, stops) +
      '<div class="dr-mgrid">' +
      '<div class="dr-mleft">' + drTimeline(status, stops, curIdx) + '</div>' +
      '<div class="dr-mright">' + drCurCard(status, stops, curIdx) + drMapCard(status, stops, curIdx) + '</div>' +
      '</div>' +
      drActionBar(status, stops, curIdx);
    host.innerHTML = html;
    drScopeClock();
    bindRoutes(host);
  }

  /* route active/paused state survives a refresh (route data itself stays
     backend-driven; this is only the local pause/resume flag) */
  function persistRouteState() {
    try {
      localStorage.setItem('smb:routeLive', routeLive ? '1' : '0');
      localStorage.setItem('smb:routePaused', routePaused ? '1' : '0');
    } catch (e) {}
  }
  function openEndConfirm(rem, total) {
    var ov = document.createElement('div');
    ov.className = 'du-ov';
    ov.innerHTML = '<div class="du-card" role="dialog" aria-modal="true">' +
      '<div class="du-head"><b class="warn">END ROUTE?</b><button type="button" class="drsc-x" id="edx" aria-label="Close">&#10005;</button></div>' +
      '<div class="du-body"><p class="du-q"><b>' + rem + ' stop' + (rem === 1 ? '' : 's') + ' of ' + total + ' are still incomplete.</b> Are you sure you want to end this route?</p></div>' +
      '<div class="du-actions">' +
      '<button type="button" class="drsc-btn" id="edContinue">Continue Route</button>' +
      '<button type="button" class="drsc-btn go" id="edEnd">&#128190; End Route</button>' +
      '</div></div>';
    document.body.appendChild(ov);
    function closeM() { ov.classList.add('out'); setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 200); }
    ov.querySelector('#edx').addEventListener('click', closeM);
    ov.addEventListener('click', function (e) { if (e.target === ov) closeM(); });
    ov.querySelector('#edContinue').addEventListener('click', closeM);
    ov.querySelector('#edEnd').addEventListener('click', function () {
      closeM();
      routeLive = false; routePaused = false; persistRouteState();
      window.__stopDriverTracking && window.__stopDriverTracking();
      showToast('Route ended \u2014 you can start a new route anytime.', 'info');
      renderRoutes();
    });
  }

  function bindRoutes(host) {
    host.querySelectorAll('[data-nav]').forEach(function (b) {
      b.addEventListener('click', function () { showView(b.getAttribute('data-nav')); });
    });
    host.querySelectorAll('[data-dr]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();   // route-stop rows are clickable containers
        var a = b.getAttribute('data-dr');
        if (a === 'reopt') { reloadRoute(); return; }
        if (a === 'retry') { routeErr = null; reloadRoute(); return; }
        if (a === 'start') {
          if (shiftState() !== 'available') { showToast('Set your driver status to Available before starting.', 'error'); renderRoutes(); return; }
          if (gpsState.denied) { requestGpsEnable(); renderRoutes(); return; }
          routeLive = true; routePaused = false; persistRouteState();
          window.__startDriverTracking && window.__startDriverTracking();
          showToast('Route started \u2014 head to your first stop.', 'success');
          renderRoutes();
          return;
        }
        if (a === 'pause') {
          routePaused = true; persistRouteState();
          /* pause live position updates — resume restarts them */
          window.__stopDriverTracking && window.__stopDriverTracking();
          showToast('Route paused.', 'info');
          renderRoutes();
          return;
        }
        if (a === 'resume') {
          routePaused = false; persistRouteState();
          if (shiftState() === 'break') setDriverShift('available');
          if (!gpsState.denied) startTracking();
          showToast('Route resumed.', 'success');
          renderRoutes();
          return;
        }
        if (a === 'end') {
          var stopList = routeStops(), coll = routeCollectable(stopList);
          var rem = coll.length - routeDone(coll);
          if (routeStatus() === 'completed' || rem <= 0) {
            routeLive = false; routePaused = false; persistRouteState();
            window.__stopDriverTracking && window.__stopDriverTracking();
            showToast('Route complete \u2014 you can start a new route anytime.', 'success');
            renderRoutes();
            return;
          }
          openEndConfirm(rem, stopList.length);
          return;
        }
        if (a === 'nav') { navSet(b.getAttribute('data-bin')); return; }
        if (a === 'avail') { setDriverShift('available'); renderRoutes(); return; }
        if (a === 'gps') { requestGpsEnable(); renderRoutes(); return; }
        if (a === 'sccur') { scanRoute(); return; }
        if (a === 'vstop') { openTaskDetails(b.getAttribute('data-bin')); return; }
        if (a === 'opencur') {
          var stops = routeStops(); var idx = routeCurrentIdx(stops);
          var bin = stops[idx];
          if (bin) openTaskDetails(bin.dustbin_id);
          return;
        }
      });
    });
    host.querySelectorAll('[data-scanstop]').forEach(function (b) {
      b.addEventListener('click', function (e) { e.stopPropagation(); scanRoute(); });
    });
    host.querySelectorAll('[data-dstop]').forEach(function (s) {
      s.addEventListener('click', function () { openTaskDetails(s.getAttribute('data-dstop')); });
    });
  }
