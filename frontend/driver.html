<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Driver Panel | SmartBin</title>
  <link rel="stylesheet" href="assets/css/ws.css">
  <link rel="stylesheet" href="assets/css/saas.css">
  <link rel="stylesheet" href="assets/css/ai-assistant.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="assets/css/driver.css">
</head>
<body data-role="driver" data-page="driver" data-ai="driver">
  <div id="drvLoader" class="drv-loader"><div class="drv-loader-spin"></div><div>Connecting to Collection Network...</div></div>

  <aside class="d-sbar" id="dSidebar">
    <div class="d-sbar-brand">
      <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#d97706"/><path d="M3 20l2-7h22l2 7M5 20h22v5H5z"/><circle cx="9" cy="20" r="2.5" fill="#fff"/><circle cx="23" cy="20" r="2.5" fill="#fff"/></svg>
      <span>SmartBin</span>
    </div>
    <div class="d-dtag"><i></i>Driver Operations</div>
    <nav class="d-nav">
      <a href="#" data-view="dashboard" class="active"><i data-ic="dash"></i><span>Dashboard</span></a>
      <a href="#" data-view="collections"><i data-ic="collections"></i><span>My Collections <b class="d-badge" id="myColBadge">0</b></span></a>
      <a href="#" data-view="scan"><i data-ic="scan"></i><span>Scan &amp; Upload</span></a>
      <a href="#" data-view="assigned"><i data-ic="assigned"></i><span>Assigned Bins <b class="d-badge" id="assignBadge">0</b></span></a>
      <a href="#" data-view="routes"><i data-ic="routes"></i><span>Assigned Routes</span></a>
      <a href="#" data-view="history"><i data-ic="history"></i><span>Collection History</span></a>
      <a href="#" data-view="complaints"><i data-ic="complaints"></i><span>Complaints <b class="d-badge" id="compBadge">0</b></span></a>
      <a href="#" data-view="notifications"><i data-ic="bell"></i><span>Notifications <b class="d-badge" id="notifBadge">0</b></span></a>
      <a href="#" data-view="profile"><i data-ic="user"></i><span>Profile</span></a>
      <a href="#" data-view="settings"><i data-ic="settings"></i><span>Settings</span></a>
    </nav>
    <div class="d-sbar-user">
      <div class="d-avatar" id="dAvatar">?</div>
      <div class="d-user-meta"><strong id="dUserName">Driver</strong><span id="dUserStatus">Verified</span></div>
      <button class="d-logout" id="dLogout" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <div class="d-main">
    <header class="d-topbar">
      <button class="d-hamburger" id="dHamburger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="d-topbar-left">
        <span class="d-topbar-title" id="dPageTitle">Dashboard</span>
        <span class="d-topbar-sub" id="dPageSub">Your daily collection overview</span>
      </div>
      <div class="d-topbar-right">
        <span class="d-live off"><i></i>GPS Offline</span>
        <span class="d-clock" id="dClock"></span>
      </div>
    </header>
    <main class="d-content" id="dViewHost"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ai-assistant.js"></script>
<script src="assets/js/ws-init.js"></script>
  <script>
  var SESSION = window.Auth.guard('driver');
  if (!SESSION) { throw new Error('guard'); }

  var ICONS = {
    dash: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
    tasks: '<svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
    map: '<svg viewBox="0 0 24 24"><path d="M9 4L3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4z"/><circle cx="12" cy="11" r="2.5"/></svg>',
    route: '<svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H14a4 4 0 004-4v-8"/><path d="M12 8l-1-2 2-1 1 2z"/></svg>',
    history: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.7 2.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
    gauge: '<svg viewBox="0 0 24 24"><path d="M5 19a9 9 0 1114 0"/><path d="M12 12l4-3"/><path d="M12 12a2 2 0 11-2 2"/></svg>',
    board: '<svg viewBox="0 0 24 24"><path d="M12 15l-4 5h8l-4-5z"/><circle cx="12" cy="9" r="6"/><path d="M9 9l2 2 4-4"/></svg>',
    bell: '<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>',
    user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>',
    collections: '<svg viewBox="0 0 24 24"><path d="M3 6h18M5 6v14a2 2 0 002 2h10a2 2 0 002-2V6"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M9 14l2 2 4-4"/></svg>',
    scan: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/><path d="M20 14v3h-3M20 20h-3"/></svg>',
    assigned: '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 12h8M8 8h5M8 16h6"/></svg>',
    routes: '<svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H14a4 4 0 004-4v-8"/><path d="M12 8l-1-2 2-1 1 2z"/></svg>',
    complaints: '<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>'
  };
  document.querySelectorAll('.d-nav a i').forEach(function (el) { el.innerHTML = ICONS[el.getAttribute('data-ic')] || ''; });

  var TITLES = {
    dashboard: ['Dashboard', 'Your daily collection overview'],
    collections: ['My Collections', 'Collections you have recorded for your area'],
    scan: ['Scan & Upload', 'Scan a dustbin QR code to record a live collection'],
    assigned: ['Assigned Bins', 'Bins mapped to your area and route'],
    routes: ['Assigned Routes', 'Optimised collection route for your assigned bins'],
    history: ['Collection History', 'Bins you have fully serviced'],
    complaints: ['Complaints', 'Report and track bin issues in your area'],
    notifications: ['Notifications', 'Tasks and emergency alerts'],
    profile: ['Profile', 'Your driver account and vehicle'],
    settings: ['Settings', 'Thresholds, notifications and account preferences'],
    tasks: ['Collection Tasks', 'Smart Bin collection requests for your area'],
    map: ['Task Map', 'Live location map of your assigned bins'],
    route: ['Route Plan', 'Optimised collection route generator'],
    performance: ['Performance', 'Your efficiency and readiness scores'],
    leaderboard: ['Leaderboard', 'Weekly driver rankings and badges']
  };

  var city = { lat: 18.5204, lng: 73.8567 };
  function seedHash(s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
  function binPos(b) {
    var a = seedHash('lat' + b.dustbin_id) * 360, r = 2 + seedHash(b.dustbin_id) * 6;
    return { lat: city.lat + (r / 111) * Math.cos(a * Math.PI / 180), lng: city.lng + (r / (111 * Math.cos(city.lat * Math.PI / 180))) * Math.sin(a * Math.PI / 180) };
  }
  function distKm(b1, b2) {
    var R = 6371, x1 = b1.lat * Math.PI / 180, x2 = b2.lat * Math.PI / 180,
      dLat = (b2.lat - b1.lat) * Math.PI / 180, dLng = (b2.lng - b1.lng) * Math.PI / 180;
    var a = Math.sin(dLat / 2) ** 2 + Math.cos(x1) * Math.cos(x2) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function formatDist(km) { if (km == null || !isFinite(km)) return '—'; return km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km'; }
  function timeAgo(dt) {
    if (!dt) return 'just now';
    var diff = (Date.now() - new Date(dt).getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var BINS = [];
  var LEADERBOARD = [];
  var DRIVER = null;
  var DRIV_SUM = null;
  var MYCOLLS = [];
  var COMPLAINTS = [];
  var currentView = 'dashboard';
  var TASK_KEY = 'smb:driverTasks';
  var tasks = {};

  /* real backend-synced automatic collection task assigned by the Municipality */
  var CUR_TASK = null;            // active CollectionTask for this driver
  var lastNotifiedTaskId = null;  // avoid duplicate notifications for the same task
  var TASK_ALL = [];              // full task history for this driver (real KPI source)

function loadTasks() { try { tasks = JSON.parse(localStorage.getItem(TASK_KEY) || '{}'); } catch (e) { tasks = {}; } }
  function saveTasks() { localStorage.setItem(TASK_KEY, JSON.stringify(tasks)); }

  /* ============================================================
     Backend-synced automatic collection task (assigned by the
     Municipality). CUR_TASK is polled from GET /tasks/driver/{id}/active
     so new assignments appear without a manual refresh.
     ============================================================ */
  function taskStep(t) {
    if (!t) return 0;
    return { ASSIGNED: 1, ACCEPTED: 2, ON_ROUTE: 3, ARRIVED: 4, COLLECTING: 5, COMPLETED: 6 }[t.status] || 0;
  }
  function taskBtn(t) {
    if (!t) return '';
    // Returns a labelled, backend-backed action button (sole per-state action).
    if (t.status === 'ASSIGNED') {
      return '<button class="d-act go" data-task-begin="' + t.task_id + '">&#8594; Start Collection</button>';
    }
    if (t.status === 'ACCEPTED') {
      return '<button class="d-act go" data-task-go="' + t.task_id + '">&#8594; Start Route</button>';
    }
    if (t.status === 'ON_ROUTE') {
      return '<button class="d-act done" data-task-arrive="' + t.task_id + '">&#9873; Mark Arrived</button>';
    }
    if (t.status === 'ARRIVED') {
      return '<button class="d-act go" data-task-collect="' + t.task_id + '">&#8635; Start Collection</button>';
    }
    if (t.status === 'COLLECTING') {
      return '<button class="d-act done" data-task-goscan="1">&#128269; Scan QR</button>';
    }
    return '<span class="d-done-tag">&#10003; Completed</span>';
  }
  function stateLabel(st) {
    return { ASSIGNED: 'ASSIGNED', ACCEPTED: 'EN ROUTE', ON_ROUTE: 'EN ROUTE', ARRIVED: 'ARRIVED', COLLECTING: 'COLLECTING', COMPLETED: 'COMPLETED' }[st] || st;
  }
  /* Start Collection from ASSIGNED must pass through ACCEPTED (real transition),
     then immediately head to ON_ROUTE — both are existing backend endpoints. */
  async function beginChainedTask(tid) {
    try { await api.post('/tasks/' + tid + '/accept', {}); } catch (e) { /* may already be accepted */ }
    try {
      var target = await api.post('/tasks/' + tid + '/start-route', {});
      CUR_TASK = target;
    } catch (e2) { /* may already be ON_ROUTE — keep current */ }
    showToast('Collection started — en route to the bin.', 'info');
    pollCurrentTask();
  }
  function taskCtas(t) {
    if (!t) return '';
    var map = '<button class="d-link" data-ct-view="1">View on Map</button>';
    if (t.status === 'ASSIGNED' || t.status === 'ACCEPTED' || t.status === 'ON_ROUTE') {
      return '<button class="d-link" data-detail="' + esc(t.dustbin_code) + '">View Route</button>' + map;
    }
    if (t.status === 'ARRIVED') {
      return '<button class="d-link" data-ct-go="1">Scan QR</button>' + map;
    }
    return map;
  }
  function currentTaskPhysical(t) {
    if (!t) return null;
    return BINS.filter(function (b) { return (b.dustbin_id === t.dustbin_code); })[0] || null;
  }
  async function pollCurrentTask() {
    if (!DRIVER || !DRIVER.id) return;
    try {
      var t = await api.get('/tasks/driver/' + DRIVER.id + '/active');
      var prev = CUR_TASK;
      CUR_TASK = t || null;
      // notify once per newly-assigned task
      if (CUR_TASK && (!prev || prev.task_id !== CUR_TASK.task_id) && CUR_TASK.task_id !== lastNotifiedTaskId) {
        lastNotifiedTaskId = CUR_TASK.task_id;
        notifyAssignedTask(CUR_TASK);
      }
      if (currentView === 'dashboard') renderDashboard();
      else if (currentView === 'tasks') renderTasks();
      else if (currentView === 'routes') renderRoutes();
    } catch (e) { /* keep previous */ }
  }
  function notifyAssignedTask(t) {
    var pct = Math.round(t.fill_level || 0);
    showToast('New collection assigned: ' + t.dustbin_code + ' — ' + pct + '% full. Automatically assigned to you.', 'success');
    flashTaskBanner(t);
  }
  function driverTaskActions(t) {
    return {
      ASSIGNED: 'ASSIGNED',
      ACCEPTED: t.status,
      ON_ROUTE: 'ON_ROUTE',
      ARRIVED: t.status,
      COLLECTING: t.status
    }[t.status];
  }
  function flashTaskBanner(t) {
    var b = document.getElementById('dCurTaskBanner');
    if (!b) return;
    b.style.display = 'block';
    b.classList.remove('show');
    void b.offsetWidth;
    b.classList.add('show');
    b.innerHTML = '<strong>&#128227; New Collection Assigned</strong>' +
      '<span>NEW COLLECTION ASSIGNED &mdash; ' + esc(t.dustbin_code) + ' &middot; ' + esc(t.location || 'Area') + ' / ' + Math.round(t.fill_level) + '% full / Automatically assigned to you.</span>' +
      '<div class="d-cta-row">' +
      '<button class="d-link" data-banner-view="1">View Task</button>' +
      '<button class="d-link" data-banner-map="1">View on Map</button></div>';
    var v = b.querySelector('[data-banner-view]');
    if (v) v.addEventListener('click', function () { b.style.display = 'none'; showView('tasks'); });
    var m = b.querySelector('[data-banner-map]');
    if (m) m.addEventListener('click', function () { b.style.display = 'none'; showView('map'); });
    setTimeout(function () { if (b.style.display !== 'none') b.style.display = 'none'; }, 9000);
  }
  async function taskApi(tid, action) {
    try {
      var r = await api.post('/tasks/' + tid + '/' + action, {});
      CUR_TASK = r;
      showToast(action.replace('-', ' ') + ' -> ' + r.status, 'info');
      pollCurrentTask();
      return r;
    } catch (e) { showToast(e.message || 'Action failed', 'error'); throw e; }
  }
  function pendingBins() {
    return BINS.filter(function (b) {
      return !(tasks[b.dustbin_id] && tasks[b.dustbin_id].state === 'collected') && (b.fill_level || 0) >= 70;
    });
  }
  function collectedIds() {
    return Object.keys(tasks).filter(function (k) { return tasks[k].state === 'collected'; });
  }

  function driverArea() {
    return ((DRIVER && (DRIVER.assigned_area || '')) || '').toLowerCase();
  }
  function driverRoute() {
    return ((DRIVER && (DRIVER.assigned_route || '')) || '').toLowerCase();
  }
  /* bins mapped to this driver: match assigned area/route if set, else all ready bins */
  function assignedBins() {
    var area = driverArea(), route = driverRoute();
    return BINS.filter(function (b) {
      var loc = String(b.location || '').toLowerCase();
      var inArea = area ? (loc.indexOf(area) !== -1 || loc.indexOf(route) !== -1) : true;
      return inArea;
    });
  }
  function assignedPending() {
    return assignedBins().filter(function (b) { return (b.fill_level || 0) >= 40; });
  }
  function driverEmpLabel() {
    if (!DRIVER) return (SESSION.name || 'Driver');
    return DRIVER.employee_id || ('EMP#' + DRIVER.id);
  }
  function fmtDate(dt) {
    if (!dt) return '—';
    var d = new Date(dt);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function fmtTime(dt) {
    if (!dt) return '—';
    var d = new Date(dt);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function countUp(el, end, dur, dec) {
    if (!el) return; var start = performance.now(); dur = dur || 1100;
    (function frame(now) {
      var t = Math.min((now - start) / dur, 1), e = 1 - Math.pow(1 - t, 3);
      el.textContent = (end * e).toFixed(dec || 0); if (t < 1) requestAnimationFrame(frame);
    })(performance.now());
  }

  loadTasks();
  document.getElementById('dLogout').addEventListener('click', function () { window.__stopDriverTracking && window.__stopDriverTracking(); window.Auth.logout(); });
  document.getElementById('dHamburger').addEventListener('click', function () { document.getElementById('dSidebar').classList.toggle('open'); });
  (function () {
    var s = window.Auth.session();
    if (s) {
      document.getElementById('dUserName').textContent = s.name;
      document.getElementById('dAvatar').textContent = (s.name || 'D').charAt(0).toUpperCase();
      var st = document.getElementById('dUserStatus');
      if (s.status === 'pending') { st.textContent = 'Pending'; st.style.color = '#f59e0b'; }
      else if (s.status === 'rejected') { st.textContent = 'Rejected'; st.style.color = '#ef4444'; }
    }
  })();
  function tickClock() { document.getElementById('dClock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  tickClock(); setInterval(tickClock, 20000);

function showView(key) {
    closeScanner();   // stop any open scanner/camera when the driver navigates; renderScan re-opens its own
    closeAbDrawer();  // drop the assigned-bin details drawer on navigation
    currentView = key;
    document.querySelectorAll('.d-nav a').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-view') === key); });
    document.getElementById('dPageTitle').textContent = TITLES[key][0];
    document.getElementById('dPageSub').textContent = TITLES[key][1];
    var host = document.getElementById('dViewHost'); host.scrollTop = 0;
    ({ dashboard: renderDashboard, collections: renderCollections, scan: renderScan, assigned: renderAssigned, routes: renderRoutes, history: renderHistory, complaints: renderComplaints, notifications: renderNotifications, profile: renderProfile, settings: renderSettings, tasks: renderTasks, map: renderMap, route: renderRoute, performance: renderPerformance, leaderboard: renderLeaderboard })[key]();
    if (window.matchMedia('(max-width: 900px)').matches) document.getElementById('dSidebar').classList.remove('open');
  }
  document.querySelectorAll('.d-nav a').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); showView(a.getAttribute('data-view')); });
  });

/* ---------- views ---------- */
  function renderDashboard() {
    var host = document.getElementById('dViewHost');
    var t = CUR_TASK;
    var shift = shiftState();
    var busy = isBusyTask(t);
    var tally = taskTally();
    var openComps = driverOpenComplaints().length;
    var unreadNotifs = buildNotifs().filter(function (n) { return !n.read; }).length;

    if (!dataReady) { host.innerHTML = dashSkeleton(); return; }

    var err = (dashErr ? '<div class="dash-error"><i>&#9888;</i><span>Unable to load dashboard data. Please try again.</span><button data-retry="1">Retry</button></div>' : '');

    host.innerHTML =
      '<div class="driver-dashboard">' +
      '<div class="welcome-card">' +
      '  <div class="wc-left">' +
      '    <div class="wc-top">' +
      '      <span class="wc-eyebrow">Driver Operations</span>' +
      '      <button class="wc-bell" data-goto="notifications" title="Notifications">Notifications' +
      (unreadNotifs ? '<b>' + unreadNotifs + '</b>' : '') + '</button>' +
      '    </div>' +
      '    <h1>' + greeting() + ', <em>' + esc(SESSION.name.split(' ')[0]) + '</em>.</h1>' +
      '    <p class="wc-sub">You\'re ready for today\'s collection round.</p>' +
      '    <div class="wc-shift">' +
      '      <span class="wc-shift-dot ' + shiftClass(shift) + '"></span>' +
      '      <span class="wc-shift-label">Driver status</span>' +
      '      <select id="dShiftSel" class="wc-shift-select" aria-label="Driver status">' +
      '        <option value="available">Available</option>' +
      '        <option value="break">On Break</option>' +
      '        <option value="offline">Offline</option>' +
      '      </select>' +
      '    </div>' +
      '  </div>' +
      '  <div class="wc-art" aria-hidden="true">' +
      '    <div class="wc-art-route"></div>' +
      '    <div class="wc-art-bin"><i></i><b>DB</b></div>' +
      '    <div class="wc-art-truck"><span class="w1"></span><span class="w2"></span></div>' +
      '  </div>' +
      '</div>' +
      err +
      (busy ? '<div class="d-banner" id="dCurTaskBanner" style="display:none"></div>' : '') +
      (busy ? currentTaskCard(t) : availabilityCard(shift, t)) +
      '<div class="kpi-grid">' +
      dkpi('Assigned Today', tally.assigned, 'blue', 'Bins assigned for today\'s shift') +
      dkpi('Completed', tally.completed, 'green', 'Successfully completed') +
      dkpi('Remaining', tally.remaining, 'amber', 'Tasks still pending') +
      shiftDkpi(shift, t) +
      '</div>' +
      '<div class="operational-grid">' +
      '  <section class="dash-card next-collection-card">' + nextCollectionCard(t) + '</section>' +
      '  <section class="dash-card route-card">' + routeStripCard() + '</section>' +
      '  <section class="dash-card performance-card">' + perfCard() + '</section>' +
      '</div>' +
      '<div class="secondary-grid">' +
      '  <section class="dash-card assigned-bins-card">' + assignedListCard() + '</section>' +
      '  <section class="dash-card recent-collections-card">' + recentFeedCard() + '</section>' +
      '  <section class="dash-card location-card">' + locationCard() + '</section>' +
      '</div>' +
      '<div class="bottom-grid">' +
      '  <section class="dash-card collection-actions">' + quickActionsCard(t) + '</section>' +
      '  <section class="dash-card complaints-card">' + compCard(openComps) + '</section>' +
      '</div>' +
      '</div>';

    var sel = document.getElementById('dShiftSel');
    if (sel) {
      sel.value = shift;
      sel.addEventListener('change', function () { setDriverShift(sel.value); });
    }
    host.querySelectorAll('[data-goto]').forEach(function (b) { b.addEventListener('click', function () { showView(b.getAttribute('data-goto')); }); });
    host.querySelectorAll('[data-detail]').forEach(function (b) { b.addEventListener('click', function () { openTaskDetails(b.getAttribute('data-detail')); }); });
    host.querySelectorAll('[data-loc-enable]').forEach(function (b) { b.addEventListener('click', function () { requestGpsEnable(); }); });
    host.querySelectorAll('[data-gps-off]').forEach(function (b) { b.addEventListener('click', function () { stopTracking(false); renderDashboard(); }); });
    host.querySelectorAll('[data-shift-set]').forEach(function (b) { b.addEventListener('click', function () { setDriverShift(b.getAttribute('data-shift-set')); }); });
    host.querySelectorAll('[data-retry]').forEach(function (b) { b.addEventListener('click', function () { refreshDriverData().then(function () { renderDashboard(); }); }); });
    host.querySelectorAll('[data-q-go]').forEach(function (b) { b.addEventListener('click', function () { showView(b.getAttribute('data-q-go')); }); });
    host.querySelectorAll('.kpi-card strong[data-count]').forEach(function (el) {
      if (el.getAttribute('data-count') && !isNaN(parseFloat(el.getAttribute('data-count')))) countUp(el, parseFloat(el.getAttribute('data-count')));
    });
    bindTaskButtons(host);
  }

/* ---- prominent CURRENT COLLECTION TASK card (driver console) ---- */
  function currentTaskCard(t) {
    var pct = Math.round(t.fill_level || 0);
    var p = priorityOf(pct);
    var dist = (t.distance_km != null) ? t.distance_km.toFixed(1) + ' km away' : '—';
    var assignedAgo = t.assigned_at ? timeAgo(t.assigned_at) : 'just now';
    return '<div class="current-task-card">' +
      '<span class="tc-accent ' + pCls(p) + '"></span>' +
      '<div class="tc-head">' +
      '  <span class="tc-ic ' + pCls(p) + '">&#128663;</span>' +
      '<div class="tc-title"><b>Current Collection Task</b><small>Automatically assigned to you &middot; ' + esc(t.assignment_mode || 'AUTOMATIC') + '</small></div>' +
      '  <span class="priority-pill ' + pCls(p) + '">' + p + '</span>' +
      '</div>' +
      '<div class="tc-main">' +
      '  <div class="tc-id"><span>Bin ID</span><b>' + esc(t.dustbin_code) + '</b></div>' +
      '  <div class="tc-loc"><span></span>' + esc(t.location || '—') + '</div>' +
      '  <div class="tc-fill"><div class="d-bc-bar"><span style="width:' + pct + '%" class="' + (pct >= 80 ? 'full' : 'almost') + '"></span></div><small>' + pct + '% FULL</small></div>' +
      '</div>' +
      '<div class="tc-meta">' +
      metaItem('Distance', dist) + metaItem('Priority', p) + metaItem('Assigned', assignedAgo) +
      '</div>' +
      '<div class="wf">' + workflowSteps(t) + '</div>' +
      '<div class="tc-actions">' + taskBtn(t) + '</div>' +
      '<div class="tc-cta">' + taskCtas(t) + '</div>' +
      '</div>';
  }

  function isBusyTask(t) {
    return !!t && ['ASSIGNED', 'ACCEPTED', 'ON_ROUTE', 'ARRIVED', 'COLLECTING'].indexOf(t.status) !== -1;
  }

  /* availability banner - one data-driven status shared by welcome / KPI / this card */
  function availabilityCard(shift, t) {
    var busy = isBusyTask(t);
    var st = busy ? 'busy' : shift;
    var cfg = {
      busy: {
        title: 'You\u2019re Busy', cls: 'busy',
        sub: 'Active collection on ' + (t ? esc(t.dustbin_code) + (t.location ? ' &middot; ' + esc(t.location) : '') : ''),
        note: 'Keep advancing the task below to complete this round.',
        btn: 'View Task', attr: 'data-detail="' + (t ? esc(t.dustbin_code) : '') + '"'
      },
      available: {
        title: 'You\u2019re Available', cls: 'available',
        sub: 'No active collection task right now.',
        note: 'You will be automatically assigned an eligible full bin.',
        btn: 'View Assigned Bins', attr: 'data-goto="assigned"'
      },
      break: {
        title: 'You\u2019re On Break', cls: 'break',
        sub: 'Paused \u2014 not receiving new assignments.',
        note: 'Switch back to Available when you\u2019re ready to resume.',
        btn: 'Ready Now', attr: 'data-shift-set="available"'
      },
      offline: {
        title: 'You\u2019re Offline', cls: 'offline',
        sub: 'You\u2019re currently not receiving collection assignments.',
        note: 'Go Available to start receiving tasks.',
        btn: 'Ready Now', attr: 'data-shift-set="available"'
      }
    }[st] || null;
    if (!cfg) return '';
    return '<div class="availability-card avail-' + cfg.cls + '">' +
      '<span class="ac-dot"></span>' +
      '<div class="ac-body"><b>' + cfg.title + '</b><small>' + cfg.sub + '</small>' +
      '<small class="ac-note">' + cfg.note + '</small></div>' +
      '<button class="btn-soft" ' + cfg.attr + '>' + cfg.btn + '</button>' +
      '</div>';
  }

  function dashSkeleton() {
    return '<div class="skeleton skeleton-hero"></div><div class="skeleton skeleton-avail"></div>' +
      '<div class="skeleton-kpis"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>' +
      '<div class="skeleton-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>' +
      '<div class="skeleton-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
  }

  /* ---- priority + workflow helpers ---- */
  function priorityOf(fill) { fill = Number(fill) || 0; return fill >= 90 ? 'URGENT' : fill >= 80 ? 'HIGH' : 'NORMAL'; }
  function pCls(p) { return p === 'URGENT' ? 'urgent' : p === 'HIGH' ? 'high' : 'normal'; }
  function workflowSteps(t) {
    var labels = ['ASSIGNED', 'EN ROUTE', 'ARRIVED', 'COLLECTING', 'SCAN QR', 'UNLOAD RECORDED', 'COMPLETED'];
    var cur = wfCur(t);
    return '<div class="wf-steps">' + labels.map(function (l, i) {
      var cls = cur < 0 ? '' : (i < cur ? 'done' : (i === cur ? 'current' : ''));
      return '<span class="wf-step ' + cls + '"><i></i>' + l + '</span>';
    }).join('') + '</div>';
  }
  function wfCur(t) {
    if (!t) return -1;
    return { ASSIGNED: 0, ACCEPTED: 1, ON_ROUTE: 1, ARRIVED: 2, COLLECTING: 4, COMPLETED: 7 }[t.status];
  }

  /* ---- dashboard sections ---- */
  function nextCollectionCard(t) {
    var head = '<div class="dc-head"><h3>Next Collection</h3></div>';
    /* The backend queues one active task, so "next" = the highest-priority
       pending bin not currently being worked (real data, no duplication with the task card). */
    var pend = assignedPending().slice().sort(function (a, b) { return (b.fill_level || 0) - (a.fill_level || 0); });
    var n = null;
    for (var i = 0; i < pend.length; i++) {
      if (!t || pend[i].dustbin_id !== t.dustbin_code) { n = pend[i]; break; }
    }
    if (!n) return head +
      '<div class="empty-state">No upcoming collection.<span class="empty-sub">You currently have no assigned bins.</span></div>' +
      '<div class="empty-action"><button class="btn-soft" data-goto="assigned">View Assigned Bins</button></div>';
    var pct = Math.round(n.fill_level || 0);
    var pr = priorityOf(pct);
    return head +
      '<div class="nc-card">' +
      '  <div class="nc-row"><span class="nc-id">' + esc(n.dustbin_id) + '</span>' +
      '    <span class="priority-pill ' + pCls(pr) + '">' + pr + '</span></div>' +
      '  <small class="nc-loc">' + esc(n.location || '') + '</small>' +
      '  <div class="nc-fill"><i style="width:' + pct + '%" class="' + (pct >= 80 ? 'full' : 'almost') + '"></i><b>' + pct + '% FULL</b></div>' +
      '</div>' +
      '<div class="nc-actions"><button class="btn-soft" data-detail="' + esc(n.dustbin_id) + '">View Route</button></div>';
  }

  function routeStripCard() {
    var stops = assignedPending().slice().sort(function (a, b) { return (b.fill_level || 0) - (a.fill_level || 0); });
    var html;
    if (!stops.length) {
      html = '<div class="empty-state">No route assigned.<span class="empty-sub">Today\u2019s route will appear when a collection is assigned.</span></div>';
    } else {
      html = '<div class="rc"><div class="rc-stop home"><span>H</span><b>Depot</b></div>' +
        stops.slice(0, 6).map(function (b) {
          var pct = Math.round(b.fill_level || 0);
          return '<div class="rc-link"><i></i></div>' +
            '<button class="rc-stop" data-detail="' + esc(b.dustbin_id) + '">' +
            '<span class="' + pCls(priorityOf(pct)) + '">' + pct + '</span>' +
            '<b>' + esc(b.dustbin_id) + '</b><small>' + pct + '% &middot; ' + priorityOf(pct) + '</small></button>';
        }).join('') +
        '<div class="rc-link"><i></i></div><div class="rc-stop home"><span>H</span><b>Depot</b></div>' +
        '<p class="rc-hint">' + stops.length + ' stop' + (stops.length === 1 ? '' : 's') + ' &middot; tap a stop for task details</p>';
    }
    return '<div class="dc-head"><h3>Today\'s Route</h3><button class="d-link" data-goto="routes">Open route plan</button></div>' + html;
  }

  function locationCard() {
    var secs = gpsState.lastFix ? Math.max(0, Math.round((Date.now() - gpsState.lastFix.at) / 1000)) : null;
    var st = gpsState.denied ? 'denied' : (gpsState.running ? (gpsState.lastFix ? 'active' : 'requesting') : 'stopped');
    var inner;
    if (st === 'active') {
      inner = '<div class="loc-status loc-ok"><span class="loc-ic"><i></i></span>' +
        '<div><b>GPS Online</b><small>Your live position is being shared.</small>' +
        '<small class="loc-updated">Updated ' + (secs === null || secs >= 60 ? 'recently' : secs + ' seconds ago') + '</small></div>' +
        '<button class="btn-soft" data-gps-off="1">Disable Location</button></div>';
    } else if (st === 'denied') {
      inner = '<div class="loc-status loc-bad"><span class="loc-ic"><i></i></span>' +
        '<div><b>GPS Offline</b><small>Your live location helps the municipality assign nearby collection tasks.</small></div>' +
        '<button class="btn-soft" data-loc-enable="1">Enable Location</button></div>';
    } else if (st === 'requesting') {
      inner = '<div class="loc-status loc-warn"><span class="loc-ic"><i></i></span>' +
        '<div><b>GPS Offline</b><small>Getting a GPS fix so live tracking can begin.</small></div></div>';
    } else {
      inner = '<div class="loc-status loc-warn"><span class="loc-ic"><i></i></span>' +
        '<div><b>GPS Offline</b><small>Your live position is not being shared right now.</small></div>' +
        '<button class="btn-soft" data-loc-enable="1">Enable Location</button></div>';
    }
    return '<div class="dc-head"><h3>Your Current Location</h3></div>' + inner;
  }
  function requestGpsEnable() {
    gpsState.denied = false;
    startTracking();
    setTimeout(function () { if (currentView === 'dashboard') renderDashboard(); }, 350);
  }

  function recentFeedCard() {
    var recs = (MYCOLLS || []).slice(0, 5);
    var inner = recs.length ? recs.map(function (c) {
      return '<div class="recent-row">' +
        '<span class="recent-ok">&#10003;</span>' +
        '<div class="recent-main"><b>' + esc(c.dustbin_code) + '</b><small>EMPTY &middot; ' + esc(c.location || '') + '</small></div>' +
        '<span class="recent-meta"><span>' + fmtTime(c.collected_at) + '</span><b>+' + c.points + ' pts</b></span></div>';
    }).join('') : '<div class="empty-state empty-block"><b>NO COLLECTIONS COMPLETED YET</b><span>Complete your first collection to see your activity here.</span></div>';
    return '<div class="dc-head"><h3>Recent Collections</h3><button class="d-link" data-goto="history">Full history</button></div>' + inner;
  }

  function assignedListCard() {
    var list = assignedBins().slice(0, 6);
    var inner = list.length ? list.map(function (b) {
      var pct = Math.round(b.fill_level || 0);
      var st2 = tasks[b.dustbin_id];
      var state, extra = '';
      if (CUR_TASK && CUR_TASK.dustbin_code === b.dustbin_id) { state = stateLabel(CUR_TASK.status); extra = ' task'; }
      else if (st2 && st2.state === 'collected') { state = 'COMPLETED'; extra = ' done'; }
      else state = (pct >= 80 ? 'FILLED' : pct >= 40 ? 'READY' : 'EMPTY');
      return '<button class="bin-row" data-detail="' + esc(b.dustbin_id) + '">' +
        '<span class="bin-id">' + esc(b.dustbin_id) + '</span>' +
        '<span class="bin-loc">' + esc(b.location || '—') + '</span>' +
        '<span class="priority-pill bin-pri ' + pCls(priorityOf(pct)) + '">' + priorityOf(pct) + '</span>' +
        '<span class="bin-fill"><i style="--f:' + pct + '%" class="' + (pct >= 80 ? 'full' : 'almost') + '"></i><b>' + pct + '%</b></span>' +
        '<span class="bin-state' + extra + '">' + state + '</span></button>';
    }).join('') : '<div class="empty-state">No assigned bins mapped to your area and route yet.</div>';
    return '<div class="dc-head"><h3>Assigned Bins</h3><button class="d-link" data-goto="assigned">All bins</button></div>' + inner;
  }

  function perfCard() {
    var now = Date.now();
    var today = new Date().toISOString().slice(0, 10);
    var tally = taskTally();
    var todayPts = (MYCOLLS || []).filter(function (c) { return (c.collected_at || '').slice(0, 10) === today; }).reduce(function (a, c) { return a + (c.points || 0); }, 0);
    var week = (MYCOLLS || []).filter(function (c) { return now - new Date(c.collected_at).getTime() <= 7 * 86400000; }).length;
    var rate = tally.assigned ? Math.round((tally.completed / tally.assigned) * 100) : null;
    var rows = [
      ['Completed', tally.completed, 'green'],
      ['Completion Rate', rate === null ? '—' : rate + '%', 'blue'],
      ['Points Today', todayPts, 'cyan'],
      ['This Week', week, 'amber']
    ];
    var score = (rate === null)
      ? '<div class="perf-score"><small>Performance score</small><em>Not enough data</em></div>'
      : '<div class="perf-score"><small>Performance score</small><div class="perf-score-bar"><i style="width:' + rate + '%"></i></div><b>' + rate + '%</b><button class="d-link" data-goto="performance">Details</button></div>';
    return '<div class="dc-head"><h3>Today\'s Performance</h3></div>' +
      '<div class="perf-note">Real collection history only</div>' +
      '<div class="perf-grid">' + rows.map(function (r) {
        return '<div class="perf-tile"><span class="perf-ic ' + r[2] + '"></span><b>' + r[1] + '</b><small>' + r[0] + '</small></div>';
      }).join('') + '</div>' +
      score;
  }

  function quickActionsCard(t) {
    var st = t && t.status;
    var scanOk = !!t && (st === 'ARRIVED' || st === 'COLLECTING');
    var unloadOk = !!t && st === 'COLLECTING';
    var routeOk = assignedPending().length > 0 || !!t;
    var acts = [
      { label: 'Start Route', icon: '&#8594;', v: 'routes', ok: routeOk, hint: 'No route assigned yet.' },
      { label: 'Scan QR', icon: '&#128269;', v: 'scan', ok: scanOk, hint: 'Reach the bin (ARRIVED) before scanning.' },
      { label: 'Record Unload', icon: '&#128465;', v: 'scan', ok: unloadOk, hint: 'Scan & verify the QR to enable unload recording.' },
      { label: 'Assigned Bins', icon: '&#9776;', v: 'assigned', ok: true, hint: '' }
    ];
    var html = acts.map(function (a) {
      var disabled = a.ok ? '' : ' disabled';
      var title = a.hint ? ' title="' + esc(a.hint) + '"' : '';
      return '<button class="action-btn' + (a.ok ? '' : ' off') + '" data-q-go="' + a.v + '"' + disabled + title + '><i>' + a.icon + '</i>' + a.label + '</button>';
    }).join('');
    if (!routeOk) html += '<p class="actions-hint">Actions unlock as your task advances.</p>';
    return '<div class="dc-head"><h3>Collection Actions</h3></div>' +
      '<div class="actions-grid">' + html + '</div>';
  }

  function compCard(openComps) {
    return '<div class="dc-head"><h3>Complaints</h3><button class="d-link" data-goto="complaints">View Complaints</button></div>' +
      '<div class="complaints-body">' +
      '<span class="complaints-count ' + (openComps ? 'open' : 'ok') + '"><b>' + openComps + '</b> Open</span>' +
      '<small>' + (openComps ? 'Bin issues reported in your area need attention.' : 'No open complaints in your area.') + '</small>' +
      '</div>';
  }
  function driverOpenComplaints() {
    var binRef = {};
    assignedBins().forEach(function (b) { binRef[b.dustbin_id] = true; });
    var area = driverArea();
    return (COMPLAINTS || []).filter(function (c) {
      if (c.status !== 'OPEN') return false;
      if (c.dustbin_code && binRef[c.dustbin_code]) return true;
      var loc = String(c.location || '').toLowerCase();
      return !!(area && loc.indexOf(area) !== -1);
    });
  }

  /* ---- KPIs ---- */
  function dkpi(label, val, cls, sub) {
    return '<div class="kpi-card ' + cls + '"><i class="dk"></i>' +
      '<div><small>' + label + '</small><strong data-count="' + val + '">0</strong>' +
      (sub ? '<em>' + sub + '</em>' : '') + '</div></div>';
  }
  function shiftDkpi(shift, t) {
    var busy = t && ['ASSIGNED','ACCEPTED','ON_ROUTE','ARRIVED','COLLECTING'].indexOf(t.status) !== -1;
    var label = busy ? 'ON TASK' : shiftLabel(shift);
    var cls = busy ? 'cyan' : (shift === 'available' ? 'green' : 'amber');
    return '<div class="kpi-card ' + cls + '"><i class="dk"></i>' +
      '<div><small>Driver Status</small><strong data-nocount="1">' + esc(label) + '</strong>' +
      '<em>' + (busy ? 'Active collection in progress' : (shift === 'available' ? 'Ready for assignments' : (shift === 'break' ? 'Paused — not receiving tasks' : 'Offline — not receiving tasks'))) + '</em></div></div>';
  }

  /* ---- shift status control (persisted, affects assignment eligibility) ---- */
  function shiftState() {
    var s = localStorage.getItem('smb:driverShift') || '';
    if (s !== 'available' && s !== 'break' && s !== 'offline') s = (DRIVER && (DRIVER.status === 'active' || DRIVER.status === 'verified')) ? 'available' : 'offline';
    return s;
  }
  function shiftLabel(s) { return s === 'break' ? 'ON BREAK' : s === 'offline' ? 'OFFLINE' : 'AVAILABLE'; }
  function shiftClass(s) { return s === 'available' ? 'on' : s === 'break' ? 'break' : 'off'; }
  function setDriverShift(v) {
    localStorage.setItem('smb:driverShift', v);
    if (v === 'available') { window.__startDriverTracking && window.__startDriverTracking(); }
    else { window.__stopDriverTracking && window.__stopDriverTracking(); }
    showToast('Driver status: ' + shiftLabel(v) + (v === 'available' ? ' — you are eligible for new tasks.' : ' — you will not receive new automatic assignments.'), v === 'available' ? 'success' : 'info');
    if (currentView === 'dashboard') renderDashboard();
  }
  function taskTally() {
    var today = new Date().toISOString().slice(0, 10);
    var list = (TASK_ALL || []).filter(function (tsk) { return (tsk.assigned_at || '').slice(0, 10) === today || (tsk.assigned_date || '').slice(0, 10) === today; });
    if (CUR_TASK && !list.some(function (x) { return x.task_id === CUR_TASK.task_id; })) list.push(CUR_TASK);
    if (list.length) {
      var done = list.filter(function (x) { return x.status === 'COMPLETED'; }).length;
      var pend = list.filter(function (x) { return x.status !== 'COMPLETED' && x.status !== 'CANCELLED'; }).length;
      return { assigned: list.length, completed: done, remaining: pend };
    }
    var sum = DRIV_SUM || {};
    return { assigned: sum.today_collections || 0, completed: sum.completed || 0, remaining: CUR_TASK ? 1 : 0 };
  }
  function greeting() {
    var h = new Date().getHours();
    return h < 12 ? 'Good morning' : (h < 17 ? 'Good afternoon' : 'Good evening');
  }

  /* ---- task details modal ---- */
  function cellVal(k, v) { return '<div class="d-ct-cell"><span>' + k + '</span><b>' + v + '</b></div>'; }
  function metaItem(k, v) { return '<div><span>' + k + '</span><b>' + v + '</b></div>'; }
  function modalMeta(k, v) { return '<div><span>' + k + '</span><b>' + v + '</b></div>'; }
  function statusLabel(st) {
    return st === 'ASSIGNED' ? 'ASSIGNED' : st === 'ACCEPTED' ? 'EN ROUTE' : st === 'ON_ROUTE' ? 'EN ROUTE' : st === 'ARRIVED' ? 'ARRIVED' : st === 'COLLECTING' ? 'COLLECTING' : st === 'COMPLETED' ? 'COMPLETED' : st;
  }
  function ensureTaskOverlay() {
    if (document.getElementById('dcoTaskModal')) return;
    var ov = document.createElement('div');
    ov.className = 'dco-modal-wrap';
    ov.id = 'dcoTaskModal';
    ov.innerHTML = '<div class="dco-modal">' +
      '<button class="dco-modal-x" data-close="1" aria-label="Close">&times;</button>' +
      '<div id="dcoModalBody"></div></div>';
    document.body.appendChild(ov);
    ov.querySelector('[data-close]').addEventListener('click', closeTaskDetails);
    ov.addEventListener('click', function (e) { if (e.target === ov) closeTaskDetails(); });
  }
  function openTaskDetails(binId) {
    ensureTaskOverlay();
    var body = document.getElementById('dcoModalBody');
    var b = BINS.filter(function (x) { return x.dustbin_id === binId; })[0] || null;
    var isCur = CUR_TASK && CUR_TASK.dustbin_code === binId;
    if (isCur) {
      var t = CUR_TASK;
      var pct = Math.round(t.fill_level || 0);
      var related = (COMPLAINTS || []).filter(function (c) { return c.dustbin_code === t.dustbin_code && c.status === 'OPEN'; })[0];
      body.innerHTML =

  }
  function closeTaskDetails() {

  }

function renderTasks() {

  }

  function stateTicks(step, state) {
    var labels = ['Assigned', 'Accepted', 'En Route', 'Collected'];
    return '<div class="d-ticks">' + labels.map(function (l, i) {
      var cls = i < step ? 'done' : i === step - 1 ? 'current' : '';

  }

function bindTaskRows(host) {

        showToast(label, act === 'collected' ? 'success' : 'info');
        currentView === 'dashboard' ? renderDashboard() : renderTasks();
      });
    });
  }

  /* Bind the real backend collection-task action buttons (single assigned task). */

    if (scans) scans.addEventListener('click', function () { showView('scan'); });

    mvs.forEach(function (m) { m.addEventListener('click', function () { showView('map'); }); });

  /* ============================================================
     NAVIGATION MAP — real interactive map (Leaflet + OpenStreetMap)
     Shows the driver's live GPS position and the destination SmartBin,
     draws the route/connection, computes distance + ETA, and offers
     external navigation. Reuses existing data + helpers (BINS,
     gpsState.lastFix, realPos/binPos, distKm/formatDist, routes).
     ============================================================ */
  var navTarget = null;       // destination bin object
  var navMap = null;          // Leaflet map instance
  var navDriverMarker = null; // Leaflet marker (driver)
  var navDestMarker = null;   // Leaflet marker (destination)
  var navLine = null;         // straight connection line (always visible)
  var navRoad = null;         // real road route (OSRM) when online
  var navDynamic = 0;         // token to ignore stale OSRM responses
  var navGpsWait = false;     // one-shot getCurrentPosition in flight

  /* resolve a bin position — real lat/lng when stored, else reuse the
     app's existing deterministic placement (same fallback as bin-map.html). */
  function navPos(b) {
    if (!b) return null;
    var r = realPos(b);
    if (r) return { lat: r.lat, lng: r.lng, approx: false };
    var a = binPos(b);
    if (a && !isNaN(a.lat) && !isNaN(a.lng)) return { lat: a.lat, lng: a.lng, approx: true };
    return null;
  }
  function navBinById(id) {
    var list = BINS || [];
    for (var i = 0; i < list.length; i++) { if (list[i].dustbin_id === id) return list[i]; }
    var stops = routeStops();
    for (var j = 0; j < stops.length; j++) { if (stops[j].dustbin_id === id) return stops[j]; }
    return null;
  }
  function navResolveTarget(id) {
    if (id) { var b = navBinById(id); if (b) return b; }
    var stops = routeStops(); var idx = routeCurrentIdx(stops);
    return stops[idx] || null;
  }
  function navSet(id) {
    navTarget = navResolveTarget(id);
    navEnsureGps();
    showView('map');
  }
  function navEnsureGps() {
    if (!navigator.geolocation) { gpsState.denied = true; return; }
    if (!gpsState.running && !gpsState.denied) startTracking();
    if (navGpsWait || gpsState.lastFix) return;
    navGpsWait = true;
    navigator.geolocation.getCurrentPosition(function (pos) {
      navGpsWait = false; onGpsSuccess(pos);
    }, function (err) {
      navGpsWait = false; onGpsError(err);
    }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
  }
  function navEta(km) {
    if (km == null) return '\u2014';
    return Math.max(1, Math.round((km / 20) * 60)) + ' min';
  }
  function navExtUrl(fix, pos, t) {
    var dest = pos ? (pos.lat + ',' + pos.lng) : '';
    if (fix && dest) return 'https://www.google.com/maps/dir/?api=1&origin=' + fix.lat + ',' + fix.lng + '&destination=' + dest + '&travelmode=driving';
    if (dest) return 'https://www.google.com/maps/search/?api=1&query=' + dest;
    return t ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(t.dustbin_id + ' ' + (t.location || '')) : '';
  }
  function navPin(glyph, cls, size) {
    return L.divIcon({ className: 'nav-pin-wrap', html: '<div class="nav-pin ' + cls + '">' + glyph + '</div>', iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
  }
  function navDestroy() {
    if (navMap) { try { navMap.remove(); } catch (e) {} }
    navMap = null; navDriverMarker = null; navDestMarker = null; navLine = null; navRoad = null;
  }
  function navDrawRoute(fix, pos) {
    if (!navMap) return;
    if (navLine) { navMap.removeLayer(navLine); navLine = null; }
    if (navRoad) { navMap.removeLayer(navRoad); navRoad = null; }
    if (!fix || !pos) return;
    navLine = L.polyline([[fix.lat, fix.lng], [pos.lat, pos.lng]], {
      color: '#22D3EE', weight: 3, opacity: .85, dashArray: '6 7'
    }).addTo(navMap);
    /* real road route via OSRM (no API key); silently falls back to the line */
    navDynamic++;
    var token = navDynamic;
    var url = 'https://router.project-osrm.org/route/v1/driving/' + fix.lng + ',' + fix.lat + ';' + pos.lng + ',' + pos.lat + '?overview=full&geometries=geojson';
    fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      if (token !== navDynamic || !navMap) return;
      if (!j || !j.routes || !j.routes[0]) return;
      var rt = j.routes[0];
      var latlngs = (rt.geometry.coordinates || []).map(function (c) { return [c[1], c[0]]; });
      if (!latlngs.length) return;
      navRoad = L.polyline(latlngs, { color: '#159FE3', weight: 5, opacity: .95 }).addTo(navMap);
      if (navLine) navLine.setStyle({ opacity: .22 });
      var dEl = document.getElementById('navDist'), eEl = document.getElementById('navEta');
      if (dEl && rt.distance != null) dEl.textContent = formatDist(rt.distance / 1000);
      if (eEl && rt.duration != null) eEl.textContent = Math.max(1, Math.round(rt.duration / 60)) + ' min';
    }).catch(function () { /* keep the straight connection */ });
  }
  function navBuildMap(t, stops, pos, fix) {
    var el = document.getElementById('navMap');
    if (!el) return;
    navDestroy();
    if (typeof L === 'undefined') {
      el.innerHTML = '<div class="nav-empty"><b>Interactive map unavailable</b><p>The map library could not be loaded. Use \u201cOpen External Navigation\u201d to route with Google Maps.</p></div>';
      return;
    }
    navMap = L.map(el, { zoomControl: true, worldCopyJump: true })
      .setView([pos ? pos.lat : (fix ? fix.lat : city.lat), pos ? pos.lng : (fix ? fix.lng : city.lng)], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
    }).addTo(navMap);
    var bounds = [];
    /* context pins for the other route stops */
    stops.forEach(function (b) {
      var p = navPos(b); if (!p) return;
      if (t && b.dustbin_id === t.dustbin_id) return;
      var done = binDone(b), off = (b.status || '').toUpperCase() === 'OFFLINE', pr = priorityOf(b.fill_level);
      var col = done ? '#22C55E' : off ? '#64748B' : pr === 'URGENT' ? '#EF4444' : pr === 'HIGH' ? '#F59E0B' : '#3B82F6';
      L.circleMarker([p.lat, p.lng], { radius: 6, color: '#04121f', weight: 2, fillColor: col, fillOpacity: 1 })
        .addTo(navMap).bindTooltip(b.dustbin_id);
      bounds.push([p.lat, p.lng]);
    });
    /* destination pin */
    if (t && pos) {
      var dpct = Math.round(t.fill_level || 0), pr = priorityOf(dpct);
      navDestMarker = L.marker([pos.lat, pos.lng], { icon: navPin('\u25CF', 'dest' + (pr === 'URGENT' ? ' urgent' : ''), 28), zIndexOffset: 800 })
        .addTo(navMap).bindPopup('<b>' + esc(t.dustbin_id) + '</b><br>' + esc(t.location || '') + '<br>' + dpct + '% full');
      navDestMarker.bindTooltip(t.dustbin_id, { permanent: true, direction: 'right', offset: [12, 0], className: 'nav-tip' });
      bounds.push([pos.lat, pos.lng]);
    }
    /* driver pin (real GPS only) */
    if (fix) {
      navDriverMarker = L.marker([fix.lat, fix.lng], { icon: navPin('\u25B6', 'you', 26), zIndexOffset: 1000 })
        .addTo(navMap).bindTooltip('YOU', { permanent: true, direction: 'right', offset: [12, 0], className: 'nav-tip' });
      bounds.push([fix.lat, fix.lng]);
    }
    navDrawRoute(fix, pos);
    if (bounds.length > 1) navMap.fitBounds(bounds, { padding: [44, 44], maxZoom: 16 });
    else if (bounds.length === 1) navMap.setView(bounds[0], 15);
    setTimeout(function () { if (navMap) navMap.invalidateSize(); }, 60);
  }
  function navUpdate() {
    if (currentView !== 'map') return;
    if (!navMap) { renderMap(); return; }
    var fix = gpsState.lastFix, pos = navTarget ? navPos(navTarget) : null;
    if (!navDriverMarker) { renderMap(); return; }
    navDriverMarker.setLatLng([fix.lat, fix.lng]);
    navDrawRoute(fix, pos);
    var d = pos ? distKm(fix, pos) : null;
    var dEl = document.getElementById('navDist'), eEl = document.getElementById('navEta');
    if (dEl) dEl.textContent = d != null ? formatDist(d) + (pos && pos.approx ? ' ~' : '') : '\u2014';
    if (eEl) eEl.textContent = navEta(d);
    var msg = document.querySelector('.nav-msg.info');
    if (msg) msg.parentNode.removeChild(msg);
  }
  function bindNav(host, t) {
    var back = host.querySelector('#navBack');
    if (back) back.addEventListener('click', function () { showView('routes'); });
    var retry = host.querySelector('#navRetry');
    if (retry) retry.addEventListener('click', function () { gpsState.denied = false; requestGpsEnable(); navEnsureGps(); renderMap(); });
    var en = host.querySelector('#navEnable');
    if (en) en.addEventListener('click', function () { requestGpsEnable(); navEnsureGps(); renderMap(); });
    var sc = host.querySelector('#navScan');
    if (sc) sc.addEventListener('click', function () { scanRoute(); });
    var live = host.querySelector('#navLive');
    if (live) live.addEventListener('click', function () {
      /* Start / Stop Navigation — live position updates */
      if (gpsState.running) {
        stopTracking(false);
      } else {
        startTracking();
        navEnsureGps();
      }
      renderMap();
    });
  }

  function renderMap() {
    var host = document.getElementById('dViewHost');
    if (!navTarget) navTarget = navResolveTarget(null);
    var t = navTarget;
    var stops = routeStops();
    var pos = t ? navPos(t) : null;
    var fix = gpsState.lastFix;
    var g = gpsStatus();
    var gps = g === 'disabled' ? 'unsupported' : g === 'denied' ? 'denied' : g === 'active' ? 'ok' : g === 'error' ? 'off' : g === 'searching' ? 'locating' : g === 'idle' ? 'off' : 'off';
    var pct = t ? Math.round(t.fill_level || 0) : 0;

    var head = '<div class="nav-head"><div class="nav-head-l">' +
      '<span class="d-eyebrow">' + (t ? 'Navigating to' : 'Task Map') + '</span>' +
      '<h3>' + (t ? esc(t.dustbin_id) : 'Your Assigned Bins') + '</h3>' +
      '<p>' + (t ? esc(t.location || 'Location not provided') + ' &middot; ' + pct + '% FULL \u00b7 <span class="dr-pri ' + pCls(priorityOf(pct)) + '">' + priorityOf(pct) + '</span>'
        : 'Live navigation map of your assigned bins') + '</p>' +
      '</div><div class="nav-head-actions"><button type="button" class="dr-btn ghost" id="navBack">\u2190 Back to Route</button></div></div>';

    /* destination has no resolvable coordinates -> explicit state (never random) */
    if (t && !pos) {
      host.innerHTML = head + '<div class="glass d-panel nav-empty"><b>&#9888; BIN LOCATION UNAVAILABLE</b>' +
        '<p>This SmartBin does not have valid GPS coordinates.<br>Contact the municipality administrator.</p></div>';
      bindNav(host, t);
      return;
    }

    var km = (fix && pos) ? distKm(fix, pos) : null;
    var approx = pos && pos.approx;
    var stats = '<div class="nav-stats">' +
      '<div class="nav-stat"><span>Destination</span><b>' + (t ? esc(t.dustbin_id) : '\u2014') + '</b></div>' +
      '<div class="nav-stat' + (approx ? ' approx' : '') + '"><span>Distance</span><b id="navDist">' + (km != null ? formatDist(km) + (approx ? ' ~' : '') : '\u2014') + '</b></div>' +
      '<div class="nav-stat' + (approx ? ' approx' : '') + '"><span>ETA</span><b id="navEta">' + navEta(km) + '</b></div>' +
      '</div>';

    var msg = '';
    if (gps === 'unsupported') msg = '<div class="nav-msg bad">&#128205; LOCATION ACCESS REQUIRED<div style="flex:1">Your current location is not available.</div><button type="button" class="dr-btn ghost" id="navRetry">Try Again</button></div>';
    else if (gps === 'denied') msg = '<div class="nav-msg bad">&#128205; LOCATION ACCESS REQUIRED<div style="flex:1"><b>Please allow location access in your browser.</b> Your current location is not available.</div><button type="button" class="dr-btn ghost" id="navRetry">Try Again</button></div>';
    else if (gps === 'off') msg = '<div class="nav-msg warn">&#128308; GPS OFFLINE<div style="flex:1">Enable location services to use navigation.</div><button type="button" class="dr-btn ghost" id="navEnable">Enable Location</button></div>';
    else if (gps === 'locating') msg = '<div class="nav-msg info">&#128204; Locating your position\u2026</div>';
    else if (approx) msg = '<div class="nav-msg warn">&#9873; Approximate destination \u2014 this SmartBin has no stored GPS coordinates, so an area estimate is used.</div>';

    var ext = navExtUrl(fix, pos, t);
    var foot = '<div class="nav-foot">' +
      (gpsState.running
        ? '<button type="button" class="dr-btn ghost" id="navLive">&#9209; Stop Navigation</button>'
        : '<button type="button" class="dr-btn go" id="navLive">&#9654; Start Navigation</button>') +
      (t && !binDone(t) ? '<button type="button" class="dr-btn ghost" id="navScan">&#128269; Scan QR</button>' : '') +
      (ext ? '<a class="dr-btn go" id="navExt" href="' + ext + '" target="_blank" rel="noopener">&#128506; Open External Navigation</a>' : '') +
      '</div>';

    host.innerHTML = head + stats +
      '<div class="nav-stage">' + msg + '<div id="navMap" class="nav-map"></div></div>' + foot;

    navBuildMap(t, stops, pos, fix);
    bindNav(host, t);
  }

  function renderRoute() {
    var host = document.getElementById('dViewHost');
    var pend = pendingBins().slice().sort(function (a, b) { return (b.fill_level || 0) - (a.fill_level || 0); });
    var startPos = binPos({ dustbin_id: 'DEPOT' });
    var route = [].concat(pend).sort(function (a, b) {
      return seedHash(a.dustbin_id) - seedHash(b.dustbin_id);
    });
    var legs = [];
    var prev = startPos; var totalKm = 0;
    route.forEach(function (b) {
      var km = distKm(prev, binPos(b));
      legs.push(km); totalKm += km; prev = binPos(b);
    });
    totalKm += distKm(prev, startPos);

    host.innerHTML =
      '<div class="d-panel-head"><h3>Route Plan</h3>' +
      '<button class="d-link" id="dReopt">Re-optimise</button></div>' +
      '<div class="d-route-sum glass">' +

      '  <div><small>Distance</small><b>' + totalKm.toFixed(1) + ' km</b></div>' +
      '  <div><small>Est. time</small><b>' + (route.length * 9 + Math.round(totalKm * 2.2)) + ' min</b></div>' +
      '  <div><small>Unloads</small><b>+ ' + route.length * 10 + ' pts</b></div>' +
      '</div>' +
      '<div class="glass d-panel">' +
      '  <div class="d-route-steps">' +
      '    <div class="d-step home"><span>H</span><div><strong>Depot</strong><small>Start your route here</small></div></div>' +
      route.map(function (b, i) {
        var pct = Math.round(b.fill_level || 0);
        return '<div class="d-route-link"><i></i><em>' + formatDist(legs[i]) + '</em></div>' +
          '<div class="d-step"><span class="n">' + (i + 1) + '</span>' +
          '<div><strong>' + esc(b.dustbin_id) + ' &middot; ' + pct + '%</strong>' +
          '<small>' + esc(b.location || '') + '</small></div></div>';
      }).join('') +
      '    <div class="d-route-link"><i></i><em>' + formatDist(distKm(prev, startPos)) + '</em></div>' +
      '    <div class="d-step home"><span>H</span><div><strong>Back to Depot</strong><small>Route complete</small></div></div>' +
      '  </div></div>';

    host.querySelectorAll('.d-step:not(.home)').forEach(function (s) {

      });
    });
    document.getElementById('dReopt').addEventListener('click', function () {
      showToast('Route re-optimised for fastest collection.', 'success');
      renderRoute();
    });

        var okQ = !q || (String(r.collection_id) + ' ' + String(r.dustbin_code) + ' ' + String(r.location || '')).toLowerCase().indexOf(q) !== -1;

  function histRow(r) {

  function renderCollections() {
    var host = document.getElementById('dViewHost');
    var recs = (MYCOLLS || []).slice();
    document.getElementById('myColBadge').textContent = recs.length;

    var d0 = new Date(); d0.setHours(0, 0, 0, 0);
    var startToday = d0.getTime();
    var month0 = new Date(d0); month0.setDate(1);
    var DAY = 86400000;

    function at(v) { var t = new Date(v).getTime(); return isNaN(t) ? 0 : t; }
    function dayKey(v) { var d = new Date(v); return isNaN(d.getTime()) ? '—' : d.toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' }); }
    function colDT(v) {
      var d = new Date(v);
      if (isNaN(d.getTime())) return '—';
      return dayKey(v) + ' · ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function colDate(v) { return dayKey(v); }
    function colTime(v) {
      var d = new Date(v);
      if (isNaN(d.getTime())) return '—';
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    var todayN = recs.filter(function (c) { return at(c.collected_at) >= startToday; }).length;
    var weekN = recs.filter(function (c) { return at(c.collected_at) >= startToday - 6 * DAY; }).length;
    var pts = recs.reduce(function (a, c) { return a + (c.points || 0); }, 0);

    function icons(a) {
      var svg = {
        clock: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
        bars: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-6M22 20H2"/></svg>',
        stack: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5z"/><path d="M2 13l10 5 10-5"/><path d="M2 18l10 5 10-5"/></svg>',
        star: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
        scan: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 012-2h2"/><path d="M17 3h2a2 2 0 012 2v2"/><path d="M21 17v2a2 2 0 01-2 2h-2"/><path d="M7 21H5a2 2 0 01-2-2v-2"/><path d="M7 12h10"/></svg>'
      };
      return svg[a] || '';
    }
    function sumCard(ic, cls, val, label, sub) {
      return '<div class="kpi-card ' + cls + '"><div class="dk"><span class="ic">' + icons(ic) + '</span></div>' +
        '<div><small>' + label + '</small><strong>' + esc(String(val)) + '</strong><em>' + sub + '</em></div></div>';
    }
    function opt(k, l, sel) { return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + l + '</option>'; }

    host.innerHTML =
      '<div class="d-panel-head"><h3>My Collections <span class="d-count">' + recs.length + '</span></h3>' +
      '<span class="d-driver-chip">Employee ID: <b>' + esc(driverEmpLabel()) + '</b></span></div>' +
      '<div class="kpi-grid dcl-sums">' +
      sumCard('clock', 'blue', todayN, 'Today', 'Completed today') +
      sumCard('bars', 'cyan', weekN, 'This Week', 'Completed this week') +
      sumCard('stack', 'green', recs.length, 'Total Collections', 'All recorded collections') +
      sumCard('star', 'amber', '+' + pts, 'Points Earned', 'Total points earned') +
      '</div>' +
      '<div class="glass dcl-toolbar">' +
      '  <input class="d-search dcl-search" id="dclSearch" placeholder="Search collection, bin or location...">' +
      '  <select class="dcl-select" id="dclDate">' + opt('all', 'Date: All', 'all') + opt('today', 'Today') + opt('yesterday', 'Yesterday') + opt('week', 'This Week') + opt('month', 'This Month') + '</select>' +
      '  <select class="dcl-select" id="dclWaste">' + opt('all', 'Waste: All', 'all') + opt('wet', 'Wet') + opt('dry', 'Dry') + opt('recyclable', 'Recyclable') + opt('ewaste', 'E-Waste') + opt('hazardous', 'Hazardous') + opt('other', 'Other') + '</select>' +
      '  <select class="dcl-select" id="dclStatus">' + opt('all', 'Status: All', 'all') + opt('completed', 'Completed') + opt('pending', 'Pending') + opt('in_progress', 'In Progress') + '</select>' +
      '  <select class="dcl-select" id="dclSort">' + opt('newest', 'Sort: Newest First', 'newest') + opt('oldest', 'Oldest First') + opt('most', 'Most Points') + opt('least', 'Least Points') + '</select>' +
      '</div>' +
      '<div class="glass d-panel dcl-panel">' +
      '  <div class="dcl-result" id="dclResult"></div>' +
      '  <div id="dclTableHost"></div>' +
      '</div>' +
      '<div class="dcl-bottom">' +
      '  <div class="glass d-panel dcl-perf"><div class="dcl-sec-h"><h4>Collection Performance</h4><small>Real history only</small></div>' +
      '    <div class="dcl-perf-grid" id="dclPerf"></div></div>' +
      '  <div class="glass d-panel dcl-week"><div class="dcl-sec-h"><h4>Weekly Activity</h4><small>Completed per day</small></div>' +
      '    <div id="dclWeek"></div></div>' +
      '</div>';

    var tableHost = document.getElementById('dclTableHost');
    var resultEl = document.getElementById('dclResult');
    var state = { q: '', date: 'all', waste: 'all', status: 'all', sort: 'newest' };

    function dateOK(key, t) {
      if (key === 'all') return true;
      if (key === 'today') return t >= startToday;
      if (key === 'yesterday') return t >= startToday - DAY && t < startToday;
      if (key === 'week') return t >= startToday - 6 * DAY;
      if (key === 'month') return t >= month0.getTime();
      return true;
    }
    var WASTE_TAGS = ['wet', 'dry', 'recyclable', 'ewaste', 'hazardous'];
    function wasteOK(key, c) {
      if (key === 'all') return true;
      var wt = String(c.waste_type || '').toLowerCase();
      if (key === 'other') return !WASTE_TAGS.some(function (w) { return wt.indexOf(w) !== -1; });
      return wt.indexOf(key) !== -1;
    }
    function statusOK(key, c) {
      if (key === 'all') return true;
      var s = String(c.status || '').toUpperCase();
      if (key === 'completed') return s.indexOf('COMPLETED') !== -1;
      if (key === 'pending') return s.indexOf('PENDING') !== -1;
      return s.indexOf('COMPLETED') === -1 && s.indexOf('PENDING') === -1;
    }

    function apply() {
      var q = state.q.toLowerCase();
      var out = [];
      recs.forEach(function (c, i) {
        var t = at(c.collected_at);
        if (!dateOK(state.date, t)) return;
        if (!wasteOK(state.waste, c)) return;
        if (!statusOK(state.status, c)) return;
        if (q) {
          var hay = String(c.collection_id) + ' ' + String(c.dustbin_code) + ' ' + String(c.location || '') + ' ' + String(c.waste_type || '');
          if (hay.toLowerCase().indexOf(q) === -1) return;
        }
        out.push({ c: c, i: i });
      });
      out.sort(function (a, b) {
        var d = at(b.c.collected_at) - at(a.c.collected_at);
        if (state.sort === 'oldest') return -d;
        if (state.sort === 'most') return (b.c.points || 0) - (a.c.points || 0) || d;
        if (state.sort === 'least') return (a.c.points || 0) - (b.c.points || 0) || d;
        return d;
      });
      renderRows(out);
    }

    function statusPill(s) {
      var u = String(s || 'COMPLETED').toUpperCase();
      if (u.indexOf('COMPLETED') !== -1) return { cls: 'ok', label: 'Completed' };
      if (u.indexOf('FAILED') !== -1) return { cls: 'fail', label: 'Failed' };
      if (u.indexOf('PENDING') !== -1) return { cls: 'wait', label: 'Pending' };
      return { cls: 'cy', label: 'In Progress' };
    }
    function rowHtml(c, i) {
      var st = statusPill(c.status);
      return '<tr>' +
        '<td><span class="d-bin-code">' + esc(c.collection_id) + '</span></td>' +
        '<td><span class="d-bin-code">' + esc(c.dustbin_code) + '</span></td>' +
        '<td class="td-muted dcl-cell" title="' + esc(c.location || '') + '">' + esc(c.location || '—') + '</td>' +
        '<td class="td-muted dcl-cell" title="' + esc(c.waste_type || '') + '">' + esc(c.waste_type || '—') + '</td>' +
        '<td class="td-muted dcl-dt">' + colDT(c.collected_at) + '</td>' +
        '<td><span class="d-status-pill ' + st.cls + '">' + st.label + '</span></td>' +
        '<td><span class="d-pts">+' + (c.points || 0) + '</span></td>' +
        '<td><button type="button" class="dcl-action" data-detail="' + i + '">View Details</button></td></tr>';
    }
    function renderRows(rows) {
      var cnt = rows.length;
      resultEl.textContent = 'Showing ' + cnt + ' of ' + recs.length + ' collections';
      if (recs.length === 0) {
        tableHost.innerHTML =
          '<div class="dcl-none">' +
          '<div class="dcl-none-ic">' + icons('scan') + '</div>' +
          '<h4>NO COLLECTIONS RECORDED YET</h4>' +
          '<p>Completed QR scans and unloads will appear here.</p>' +
          '<button type="button" class="dcl-scan-btn" data-goto="scan">Scan a Dustbin QR</button>' +
          '</div>';
        return;
      }
      if (!rows.length) {
        tableHost.innerHTML = '<div class="dcl-nofilter">No collections match your search and filters.</div>';
        return;
      }
      tableHost.innerHTML =
        '<div class="dcl-thost"><table class="d-table dcl-table"><thead><tr>' +
        '<th>Collection ID</th><th>Dustbin</th><th>Location</th><th>Waste Type</th><th>Collected At</th><th>Status</th><th>Points</th><th></th>' +
        '</tr></thead><tbody>' + rows.map(function (r) { return rowHtml(r.c, r.i); }).join('') + '</tbody></table></div>';
    }

    function matchTask(c) {
      var hits = (TASK_ALL || []).filter(function (t) {
        return String(t.dustbin_code).toUpperCase() === String(c.dustbin_code).toUpperCase() && !!t.completed_at;
      });
      if (!hits.length) return null;
      hits.sort(function (a, b) { return Math.abs(at(a.completed_at) - at(c.collected_at)) - Math.abs(at(b.completed_at) - at(c.collected_at)); });
      return hits[0];
    }
    function taskStagesArr(t) {
      var arr = [];
      if (t.assigned_at) arr.push(['Assigned', t.assigned_at]);
      if (t.accepted_at) arr.push(['Accepted', t.accepted_at]);
      if (t.started_at) arr.push(['Route Started', t.started_at]);
      if (t.arrived_at) arr.push(['Arrived', t.arrived_at]);
      if (t.collecting_at) arr.push(['Collecting', t.collecting_at]);
      if (t.completed_at) arr.push(['Completed', t.completed_at]);
      return arr;
    }
    function stageRows(stages) {
      return stages.map(function (s) {
        return '<li class="dcl-tl-step"><span class="dcl-tl-dot">&#10003;</span>' +
          '<div><b>' + esc(s[0]) + '</b><em>' + colDT(s[1]) + '</em></div></li>';
      }).join('');
    }
    function metaItem(label, val, cls) {
      return '<div class="dcl-mi' + (cls ? ' ' + cls : '') + '"><small>' + label + '</small><b>' + esc(String(val)) + '</b></div>';
    }
    function binCurrent(c) {
      for (var i = 0; i < BINS.length; i++) if (String(BINS[i].dustbin_code).toUpperCase() === String(c.dustbin_code).toUpperCase()) return BINS[i];
      return null;
    }
    function binTag(b) {
      if (!b) return '';
      var pct = +(b.fill_level || 0);
      var st = String(b.status || '').toUpperCase();
      var label, cls;
      if (st === 'OFFLINE') { label = 'OFFLINE'; cls = 'fail'; }
      else if (pct >= 80 || st === 'FULL') { label = 'FULL'; cls = 'wait'; }
      else if (pct >= 40 || st === 'READY') { label = 'READY'; cls = 'cy'; }
      else { label = 'EMPTY'; cls = 'yes'; }
      return '<div class="dcl-check"><span class="dcl-icn ' + cls + '">&#10003;</span><span class="dcl-ck-txt"><b>Bin Status <small>(current)</small></b><em>' + esc(b.location || '') + ' &middot; ' + pct + '% full</em></span><span class="tag ' + cls + '">' + label + '</span></div>';
    }
    function escClose(e) { if (e.key === 'Escape') closeColDetail(); }
    function closeColDetail() {
      var w = host.querySelector('.dcl-drawer-wrap');
      if (w) w.remove();
      document.removeEventListener('keydown', escClose);
    }
    function openColDetail(c) {
      closeColDetail();
      var t = matchTask(c);
      var stages = t ? stageRows(taskStagesArr(t)) : stageRows([['QR Scanned', c.collected_at], ['Unload Recorded', c.collected_at], ['Completed', c.collected_at]]);
      var b = binCurrent(c);
      var wrap = document.createElement('div');
      wrap.className = 'dcl-drawer-wrap';
      wrap.innerHTML =
        '<div class="dcl-backdrop"></div>' +
        '<aside class="dcl-drawer">' +
        '  <div class="dcl-drawer-head"><div><small>Collection Details</small><h3>' + esc(c.collection_id || 'Collection') + '</h3></div>' +
        '    <button type="button" class="dcl-close" title="Close">&#10005;</button></div>' +
        '  <div class="dcl-drawer-body">' +
        '    <div class="dcl-meta">' +
        metaItem('Collection ID', c.collection_id) +
        metaItem('Dustbin ID', c.dustbin_code) +
        metaItem('Location', c.location || '—', 'wide') +
        metaItem('Waste Type', c.waste_type || '—') +
        metaItem('Collection Date', colDate(c.collected_at)) +
        metaItem('Collection Time', colTime(c.collected_at)) +
        metaItem('Driver ID', c.driver_employee_id || c.driver_id || DRIVER.employee_id) +
        metaItem('Points Earned', '+' + (c.points || 0), 'pts') +
        '    </div>' +
        '    <div class="dcl-sec-title">Scan &amp; Unload</div>' +
        '    <div class="dcl-checks">' +
        '      <div class="dcl-check"><span class="dcl-icn yes">&#10003;</span><span class="dcl-ck-txt"><b>QR Verification</b><em>Verified during Scan &amp; Unload</em></span><span class="tag yes">Verified</span></div>' +
        '      <div class="dcl-check"><span class="dcl-icn yes">&#10003;</span><span class="dcl-ck-txt"><b>Unload</b><em>Collection recorded after unload</em></span><span class="tag yes">Recorded</span></div>' +
        (b ? binTag(b) : '') +
        '    </div>' +
        '    <div class="dcl-sec-title">Collection Timeline</div>' +
        '    <ul class="dcl-tl">' + stages + '</ul>' +
        '<p class="dcl-tl-note">' + (t ? 'Synced from the assigned collection task.' : 'Recorded through the Scan &amp; Unload workflow.') + '</p>' +
        '  </div></aside>';
      host.appendChild(wrap);
      requestAnimationFrame(function () { wrap.classList.add('on'); });
      wrap.querySelector('.dcl-close').addEventListener('click', closeColDetail);
      wrap.querySelector('.dcl-backdrop').addEventListener('click', closeColDetail);
      document.addEventListener('keydown', escClose);
    }
    tableHost.addEventListener('click', function (e) {
      var el = e.target.closest('[data-detail]');
      if (el) { var r = recs[+el.getAttribute('data-detail')]; if (r) openColDetail(r); }
    });

    var elSearch = document.getElementById('dclSearch');
    var elDate = document.getElementById('dclDate');
    var elWaste = document.getElementById('dclWaste');
    var elStatus = document.getElementById('dclStatus');
    var elSort = document.getElementById('dclSort');
    var debounce;
    elSearch.addEventListener('input', function () {
      clearTimeout(debounce);
      var v = elSearch.value;
      debounce = setTimeout(function () { state.q = v; apply(); }, 180);
    });
    elDate.addEventListener('change', function () { state.date = elDate.value; apply(); });
    elWaste.addEventListener('change', function () { state.waste = elWaste.value; apply(); });
    elStatus.addEventListener('change', function () { state.status = elStatus.value; apply(); });
    elSort.addEventListener('change', function () { state.sort = elSort.value; apply(); });
    host.querySelectorAll('[data-goto]').forEach(function (b) { b.addEventListener('click', function () { showView(b.getAttribute('data-goto')); }); });

    var perfEl = document.getElementById('dclPerf');
    function tile(v, label, tone) { return '<div class="dcl-tile ' + tone + '"><b>' + esc(String(v)) + '</b><small>' + label + '</small></div>'; }
    var bins = {}; recs.forEach(function (c) { bins[c.dustbin_code] = 1; });
    var allT = TASK_ALL || [];
    var doneT = allT.filter(function (t) { var s = String(t.status || '').toUpperCase(); return s.indexOf('COMPLETED') !== -1 || !!t.completed_at; }).length;
    var perfHtml = tile(recs.length, 'Collections Completed', 'green');
    perfHtml += tile(Object.keys(bins).length, 'Bins Emptied', 'cyan');
    perfHtml += tile('+' + pts, 'Points Earned', 'amber');
    if (allT.length) perfHtml += tile(Math.round((doneT / allT.length) * 100) + '%', 'Completion Rate', 'blue');
    perfEl.innerHTML = perfHtml;

    var weekEl = document.getElementById('dclWeek');
    var wk = [0, 0, 0, 0, 0, 0, 0];

    recs.forEach(function (c) { var d = new Date(c.collected_at); if (!isNaN(d.getTime())) wk[(d.getDay() + 6) % 7]++; });
    var mx = Math.max.apply(null, wk);
    weekEl.innerHTML = mx
      ? '<div class="dcl-week-bars">' + wk.map(function (v, i) {
